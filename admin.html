<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TechShop - Quản trị</title>
<style>
:root{--c:#2563eb}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:#f6f7fb;color:#111827}
nav{background:#111827;color:#fff;padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
nav b{margin-right:auto}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 13px;background:var(--c);color:#fff;font-weight:600}
button.g{background:#e5e7eb;color:#111827}button.r{background:#dc2626}
nav button{background:#374151}nav button.on{background:var(--c)}
main{max-width:1100px;margin:20px auto;padding:0 16px}
input,select{padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;font:inherit}
.box{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px #0001;margin-bottom:16px;overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.stats div{background:#fff;border-radius:12px;padding:16px;box-shadow:0 1px 4px #0001}
.stats b{display:block;font-size:24px;color:var(--c);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid #eee;vertical-align:top}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
#login{max-width:320px;margin:15vh auto;display:flex;flex-direction:column;gap:10px}
.low{color:#dc2626;font-weight:700}
</style></head>
<body>
<div id="login" class="box">
  <h2>Đăng nhập quản trị</h2>
  <input id="pw" type="password" placeholder="Mật khẩu" onkeydown="if(event.key==='Enter')login()">
  <button onclick="login()">Đăng nhập</button>
  <small>Demo: mật khẩu <code>admin123</code> (đổi ở biến ADMIN_PW; khi có backend hãy xác thực phía server).</small>
</div>

<div id="app" hidden>
  <nav><b>⚙️ TechShop Admin</b>
    <button data-t="dash">Tổng quan</button><button data-t="prod">Sản phẩm</button><button data-t="ord">Đơn hàng</button>
    <button onclick="sessionStorage.removeItem('adm');location.reload()">Thoát</button></nav>
  <main id="view"></main>
</div>

<script>
const ADMIN_PW='admin123';
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString('vi-VN')+'₫';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STATUS=['Mới','Đang giao','Hoàn tất','Đã hủy'];
let tab='dash',editId=null;

function login(){
  if($('pw').value===ADMIN_PW){sessionStorage.setItem('adm','1');start()}else alert('Sai mật khẩu');
}
function start(){
  $('login').hidden=true;$('app').hidden=false;
  document.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;editId=null;draw()});
  draw();
}
const P=()=>LS('shop_products',[]);
const O=()=>LS('shop_orders',[]);

function draw(){
  document.querySelectorAll('nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('view').innerHTML={dash,prod,ord}[tab]();
}

function dash(){
  const o=O(),p=P(),ok=o.filter(x=>x.status!=='Đã hủy');
  const rev=ok.reduce((s,x)=>s+x.total,0);
  const low=p.filter(x=>x.stock<=5);
  return `<div class="stats">
    <div>Doanh thu<b>${fmt(rev)}</b></div><div>Tổng đơn hàng<b>${o.length}</b></div>
    <div>Đơn mới<b>${o.filter(x=>x.status==='Mới').length}</b></div><div>Sản phẩm<b>${p.length}</b></div></div><br>
    <div class="box"><h3>Sản phẩm sắp hết hàng (≤ 5)</h3>
    ${low.length?`<table>${low.map(x=>`<tr><td>${esc(x.name)}</td><td class="low">Còn ${x.stock}</td></tr>`).join('')}</table>`:'<p>Tồn kho ổn định.</p>'}</div>`;
}

function prod(){
  const p=P(),e=p.find(x=>x.id===editId)||{};
  return `<div class="box"><h3>${editId?'Sửa':'Thêm'} sản phẩm</h3><br>
    <form onsubmit="saveProd(event)">
      <input name="name" placeholder="Tên sản phẩm" required value="${esc(e.name)}">
      <input name="cat" placeholder="Danh mục" required value="${esc(e.cat)}">
      <input name="price" type="number" min="0" placeholder="Giá (VNĐ)" required value="${e.price??''}">
      <input name="stock" type="number" min="0" placeholder="Tồn kho" required value="${e.stock??''}">
      <input name="emoji" placeholder="Emoji (vd 📱)" value="${esc(e.emoji)}">
      <input name="img" placeholder="Link ảnh (tùy chọn)" value="${esc(e.img)}">
      <input name="desc" placeholder="Mô tả" value="${esc(e.desc)}">
      <button>${editId?'Cập nhật':'Thêm mới'}</button>
      ${editId?'<button type="button" class="g" onclick="editId=null;draw()">Hủy</button>':''}
    </form></div>
    <div class="box"><table><tr><th>Tên</th><th>Danh mục</th><th>Giá</th><th>Tồn</th><th></th></tr>
    ${p.map(x=>`<tr><td>${esc(x.emoji)} ${esc(x.name)}</td><td>${esc(x.cat)}</td><td>${fmt(x.price)}</td>
      <td class="${x.stock<=5?'low':''}">${x.stock}</td>
      <td><button class="g" onclick="editId=${x.id};draw()">Sửa</button> <button class="r" onclick="delProd(${x.id})">Xóa</button></td></tr>`).join('')}</table></div>`;
}
function saveProd(ev){
  ev.preventDefault();
  const f=Object.fromEntries(new FormData(ev.target)),p=P();
  const d={name:f.name.trim(),cat:f.cat.trim(),price:+f.price,stock:+f.stock,emoji:f.emoji.trim()||'📦',img:f.img.trim(),desc:f.desc.trim()};
  if(editId)Object.assign(p.find(x=>x.id===editId),d);
  else p.push({id:Math.max(0,...p.map(x=>x.id))+1,...d});
  save('shop_products',p);editId=null;draw();
}
function delProd(id){
  if(confirm('Xóa sản phẩm này?')){save('shop_products',P().filter(x=>x.id!==id));draw()}
}

function ord(){
  const o=O().slice().reverse();
  return `<div class="box"><table><tr><th>Mã</th><th>Khách hàng</th><th>Sản phẩm</th><th>Tổng</th><th>Trạng thái</th><th></th></tr>
  ${o.map(x=>`<tr><td>#${x.id}<br><small>${new Date(x.date).toLocaleString('vi-VN')}</small></td>
    <td>${esc(x.name)}<br>${esc(x.phone)}<br><small>${esc(x.addr)}${x.note?'<br>Ghi chú: '+esc(x.note):''}</small></td>
    <td>${x.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}<br><small>${x.pay==='COD'?'COD':'Chuyển khoản'}</small></td>
    <td>${fmt(x.total)}</td>
    <td><select onchange="setStatus(${x.id},this.value)">${STATUS.map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></td>
    <td><button class="r" onclick="delOrd(${x.id})">Xóa</button></td></tr>`).join('')||'<tr><td colspan="6">Chưa có đơn hàng.</td></tr>'}</table></div>`;
}
function setStatus(id,s){
  const o=O(),x=o.find(i=>i.id===id);
  if(s==='Đã hủy'&&x.status!=='Đã hủy'){ // hoàn lại tồn kho
    const p=P();x.items.forEach(i=>{const q=p.find(a=>a.id===i.id);if(q)q.stock+=i.qty});save('shop_products',p);
  }else if(x.status==='Đã hủy'&&s!=='Đã hủy'){
    const p=P();x.items.forEach(i=>{const q=p.find(a=>a.id===i.id);if(q)q.stock=Math.max(0,q.stock-i.qty)});save('shop_products',p);
  }
  x.status=s;save('shop_orders',o);draw();
}
function delOrd(id){
  if(confirm('Xóa đơn hàng này?')){save('shop_orders',O().filter(x=>x.id!==id));draw()}
}

if(sessionStorage.getItem('adm'))start();
</script>
</body></html>
