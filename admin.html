<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Quản Trị Admin - Charles & Keith VN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen">

    <header class="bg-black text-white shadow">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <h1 class="text-lg font-bold tracking-widest uppercase">Admin Dashboard</h1>
                <span class="text-xs bg-gray-800 px-2.5 py-1 rounded text-gray-300">Quản lý toàn trang</span>
            </div>
            <a href="index.html" class="text-xs uppercase tracking-wider bg-white text-black px-4 py-2 font-semibold hover:bg-gray-200 transition">Xem Website <i class="fa-solid fa-arrow-right ml-1"></i></a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Form Thêm Sản Phẩm -->
        <div class="bg-white p-6 rounded-lg shadow border border-gray-200 h-fit">
            <h2 class="text-sm font-bold uppercase tracking-wider mb-4 pb-2 border-b">Thêm Sản Phẩm Mới</h2>
            <form id="add-product-form" onsubmit="addProduct(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-semibold mb-1 uppercase">Tên sản phẩm</label>
                    <input type="text" id="name" required class="w-full border p-2.5 rounded focus:outline-none focus:border-black" placeholder="Tên túi xách / phụ kiện...">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold mb-1 uppercase">Danh mục</label>
                        <select id="category" class="w-full border p-2.5 rounded focus:outline-none focus:border-black bg-white">
                            <option value="Túi đeo vai">Túi đeo vai</option>
                            <option value="Túi đeo chéo">Túi đeo chéo</option>
                            <option value="Túi xách">Túi xách</option>
                            <option value="Túi tote">Túi tote</option>
                            <option value="Túi clutch">Túi clutch</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 uppercase">Màu sắc</label>
                        <select id="color" class="w-full border p-2.5 rounded focus:outline-none focus:border-black bg-white">
                            <option value="Đen">Đen</option>
                            <option value="Trắng">Trắng</option>
                            <option value="Nâu">Nâu</option>
                            <option value="Đỏ">Đỏ</option>
                            <option value="Hồng">Hồng</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold mb-1 uppercase">Giá bán (VNĐ)</label>
                        <input type="number" id="price" required class="w-full border p-2.5 rounded focus:outline-none focus:border-black" placeholder="2690000">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 uppercase">Giá cũ (nếu giảm)</label>
                        <input type="number" id="old_price" class="w-full border p-2.5 rounded focus:outline-none focus:border-black" placeholder="3200000">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold mb-1 uppercase">Link ảnh chính (URL)</label>
                    <input type="url" id="image_url" required class="w-full border p-2.5 rounded focus:outline-none focus:border-black" placeholder="https://...">
                </div>
                <div>
                    <label class="block font-semibold mb-1 uppercase">Link ảnh hover khi rê chuột (URL)</label>
                    <input type="url" id="hover_image_url" class="w-full border p-2.5 rounded focus:outline-none focus:border-black" placeholder="https://...">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold mb-1 uppercase">Nhãn dán (Badge)</label>
                        <input type="text" id="badge" class="w-full border p-2.5 rounded focus:outline-none focus:border-black" placeholder="MỚI, SALE, ONLINE">
                    </div>
                    <div>
                        <label class="block font-semibold mb-1 uppercase">Kích thước (Size)</label>
                        <input type="text" id="size" class="w-full border p-2.5 rounded focus:outline-none focus:border-black" value="M">
                    </div>
                </div>
                <button type="submit" class="w-full bg-black text-white py-3 font-semibold uppercase tracking-wider hover:bg-gray-800 transition">Thêm Sản Phẩm</button>
            </form>
        </div>

        <!-- Danh Sách Sản Phẩm Quản Lý -->
        <div class="lg:col-span-2 bg-white p-6 rounded-lg shadow border border-gray-200">
            <h2 class="text-sm font-bold uppercase tracking-wider mb-4 pb-2 border-b">Danh Sách Sản Phẩm Hiện Có</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="bg-gray-100 border-b uppercase text-gray-600">
                            <th class="p-3">Hình ảnh</th>
                            <th class="p-3">Tên sản phẩm</th>
                            <th class="p-3">Danh mục</th>
                            <th class="p-3">Giá</th>
                            <th class="p-3 text-center">Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="admin-product-list">
                        <!-- Load tự động từ Supabase -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT_ID.supabase.co';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchAdminProducts() {
            const tbody = document.getElementById('admin-product-list');
            tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-400">Đang tải...</td></tr>';

            const { data, error } = await _supabase.from('products').select('*').order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-red-500">Lỗi: ${error.message}</td></tr>`;
                return;
            }

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">Chưa có sản phẩm nào.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(p => `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3"><img src="${p.image_url}" class="w-10 h-12 object-cover rounded border"></td>
                    <td class="p-3 font-medium text-gray-900 max-w-xs truncate">${p.name}</td>
                    <td class="p-3 text-gray-600">${p.category}</td>
                    <td class="p-3 font-semibold">${Number(p.price).toLocaleString('vi-VN')} ₫</td>
                    <td class="p-3 text-center">
                        <button onclick="deleteProduct('${p.id}')" class="bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700 transition">Xóa</button>
                    </td>
                </tr>
            `).join('');
        }

        async function addProduct(e) {
            e.preventDefault();
            const newProduct = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                color: document.getElementById('color').value,
                price: parseFloat(document.getElementById('price').value),
                old_price: document.getElementById('old_price').value ? parseFloat(document.getElementById('old_price').value) : null,
                image_url: document.getElementById('image_url').value,
                hover_image_url: document.getElementById('hover_image_url').value,
                badge: document.getElementById('badge').value,
                size: document.getElementById('size').value
            };

            const { error } = await _supabase.from('products').insert([newProduct]);

            if (error) {
                alert('Lỗi khi thêm sản phẩm: ' + error.message);
            } else {
                alert('Thêm sản phẩm thành công!');
                document.getElementById('add-product-form').reset();
                fetchAdminProducts();
            }
        }

        async function deleteProduct(id) {
            if (confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?')) {
                const { error } = await _supabase.from('products').delete().eq('id', id);
                if (error) {
                    alert('Lỗi khi xóa: ' + error.message);
                } else {
                    fetchAdminProducts();
                }
            }
        }

        fetchAdminProducts();
    </script>
</body>
</html>
