<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXSTORE - Media Kit & Sneaker Collection</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background: #ffffff; color: #111; padding: 15px; }
    .main-container { max-width: 1200px; margin: 0 auto; border: 2px solid #000; padding: 15px; background: #fff; }
    
    /* Top Bar Header */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ccff00;
      border: 2px solid #000;
      padding: 10px 20px;
      margin-bottom: 20px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .brand-title { font-size: 16px; font-weight: 900; }
    .search-box {
      display: flex;
      align-items: center;
      background: #fff;
      border: 2px solid #000;
      border-radius: 20px;
      padding: 5px 15px;
      width: 300px;
    }
    .search-box input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 13px;
      background: transparent;
    }
    .search-box i { color: #000; cursor: pointer; }

    /* Top 3 Image Gallery */
    .top-gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }
    .gallery-card {
      border: 2px solid #000;
      border-radius: 12px;
      overflow: hidden;
      background: #f9f9f9;
      height: 180px;
    }
    .gallery-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* MEDIA KIT Header Banner */
    .media-kit-banner {
      background: #ccff00;
      border: 3px solid #000;
      text-align: center;
      padding: 20px 0;
      margin-bottom: 30px;
      box-shadow: 4px 4px 0px #000;
    }
    .media-kit-banner h1 {
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #000;
      line-height: 1;
    }

    /* Product Grid Section (The 3 columns layout from reference) */
    .product-grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .product-column-card {
      border: 2px solid #000;
      border-radius: 16px;
      background: #fcfcfc;
      padding: 12px;
      box-shadow: 4px 4px 0px #000;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    /* Product item card inside columns */
    .product-item {
      background: #fff;
      border: 2px solid #000;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.2s;
    }
    .product-item:hover {
      transform: translateY(-2px);
    }
    .product-img-wrap {
      width: 100%;
      height: 160px;
      background: #eee;
      position: relative;
    }
    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-info {
      padding: 10px;
    }
    .product-name {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #111;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-price {
      font-size: 14px;
      font-weight: 900;
      color: #d70018;
      margin-bottom: 8px;
    }
    .product-sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-bottom: 8px;
    }
    .size-tag {
      background: #eee;
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    .btn-buy {
      background: #000;
      color: #ccff00;
      border: none;
      width: 100%;
      padding: 8px;
      font-weight: bold;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
    }
    .btn-buy:hover {
      background: #333;
    }

    @media(max-width: 768px) {
      .top-gallery, .product-grid-container { grid-template-columns: 1fr; }
      .media-kit-banner h1 { font-size: 36px; }
      .top-bar { flex-direction: column; gap: 10px; }
      .search-box { width: 100%; }
    }
  </style>
</head>
<body>

<div class="main-container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-title"><i class="fa-solid fa-store"></i> COLLAB STUDIO - LUXSTORE</div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Tìm kiếm sản phẩm...">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
  </div>

  <!-- Top 3 Gallery Images (matching reference layout) -->
  <div class="top-gallery">
    <div class="gallery-card">
      <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=600&q=80" alt="Studio 1">
    </div>
    <div class="gallery-card">
      <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&w=600&q=80" alt="Studio 2">
    </div>
    <div class="gallery-card">
      <img src="https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?auto=format&fit=crop&w=600&q=80" alt="Studio 3">
    </div>
  </div>

  <!-- Media Kit Banner -->
  <div class="media-kit-banner">
    <h1>MEDIA KIT</h1>
  </div>

  <!-- Product Grid (Divided into 3 columns matching reference card layouts, where products dynamically populate) -->
  <div class="product-grid-container">
    <div class="product-column-card" id="col-1">
      <!-- Dynamic Products Col 1 -->
    </div>
    <div class="product-column-card" id="col-2">
      <!-- Dynamic Products Col 2 -->
    </div>
    <div class="product-column-card" id="col-3">
      <!-- Dynamic Products Col 3 -->
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://uleckabliwereivgxryo.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsZWNrYWJsaXdlcmVpdmd4cnlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzI1NTUsImV4cCI6MjEwNjMwODU1NX0.Sa5fY_OceWa7TI9yqBSMLM24ZTEN6g10j4RrXvENs3o';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function loadProductsForMediaKit() {
    try {
      const { data: products, error } = await supabaseClient.from('products').select('*').order('id', { ascending: false });
      if (error) throw error;

      const col1 = document.getElementById('col-1');
      const col2 = document.getElementById('col-2');
      const col3 = document.getElementById('col-3');

      col1.innerHTML = '';
      col2.innerHTML = '';
      col3.innerHTML = '';

      if (!products || products.length === 0) {
        col1.innerHTML = '<p style="text-align:center; padding:20px;">Chưa có sản phẩm.</p>';
        return;
      }

      products.forEach((item, index) => {
        const imageUrl = item.main_image || (item.images && item.images[0]) || 'https://via.placeholder.com/300';
        const priceFormatted = Number(item.price).toLocaleString('vi-VN') + ' đ';
        const sizesHtml = (item.sizes || []).map(s => `<span class="size-tag">${s}</span>`).join('');

        const productHTML = `
          <div class="product-item">
            <div class="product-img-wrap">
              <img src="${imageUrl}" alt="${item.name}">
            </div>
            <div class="product-info">
              <div class="product-name" title="${item.name}">${item.name}</div>
              <div class="product-price">${priceFormatted}</div>
              <div class="product-sizes">${sizesHtml}</div>
              <button class="btn-buy" onclick="alert('Xem chi tiết: ${item.name}')">Xem Chi Tiết</button>
            </div>
          </div>
        `;

        // Distribute products across the 3 columns like the reference image
        if (index % 3 === 0) {
          col1.innerHTML += productHTML;
        } else if (index % 3 === 1) {
          col2.innerHTML += productHTML;
        } else {
          col3.innerHTML += productHTML;
        }
      });
    } catch (err) {
      console.error('Lỗi tải sản phẩm:', err);
    }
  }

  loadProductsFromSupabase = loadProductsForMediaKit;
  loadProductsForMediaKit();
</script>

</body>
</html>
