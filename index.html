<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUXSTORE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{background:#f4f6f8;color:#222}
header{position:sticky;top:0;z-index:5;background:#111;color:#fff;padding:12px 20px;display:flex;gap:12px;align-items:center}
header h1{font-size:22px;letter-spacing:2px}
header input{flex:1;padding:9px 12px;border:0;border-radius:6px;font-size:14px}
button{cursor:pointer;border:0;border-radius:6px;padding:10px 16px;background:#007bff;color:#fff;font-weight:700;font-size:14px}
button:disabled{opacity:.5;cursor:not-allowed}
button.g{background:#e5e7eb;color:#222}
nav{background:#fff;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e5e7eb}
nav button{background:#f1f3f5;color:#222;padding:7px 14px}
nav button.on{background:#111;color:#fff}
#sub{background:#fff}
main{max-width:1150px;margin:20px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 8px #0001;cursor:pointer}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#eee;display:block}
.card div{padding:12px}
.price{color:#d62828;font-weight:700}
.old{color:#888;text-decoration:line-through;font-size:13px;margin-left:6px;font-weight:400}
.ov{position:fixed;inset:0;background:#0008;display:none;z-index:20;align-items:center;justify-content:center;padding:12px}
.ov.open{display:flex}
.box{background:#fff;border-radius:12px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:700px){.box{grid-template-columns:1fr}}
#big{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#eee}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:54px;height:54px;object-fit:cover;border-radius:5px;cursor:pointer;border:2px solid transparent}
.thumbs img.on{border-color:#007bff}
.sizes{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.sizes button{background:#fff;color:#222;border:1px solid #ccc;padding:7px 12px}
.sizes button.on{background:#111;color:#fff;border-color:#111}
#cart{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:#fff;z-index:30;padding:16px;display:flex;flex-direction:column;gap:8px;overflow:auto;transform:translateX(100%);transition:.25s;box-shadow:-4px 0 16px #0003}
#cart.open{transform:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee;font-size:14px}
.row img{width:46px;height:46px;object-fit:cover;border-radius:5px}
#cart input,#cart textarea{width:100%;padding:9px;border:1px solid #ccc;border-radius:6px;font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:50}
</style>
</head>
<body>
<header>
  <h1>LUXSTORE</h1>
  <input id="search" placeholder="Tìm sản phẩm...">
  <button onclick="toggleCart()">🛒 Giỏ hàng (<span id="cnt">0</span>)</button>
</header>
<nav id="cats"></nav>
<div id="sub"></div>
<main><div id="grid" class="grid"><p>Đang tải sản phẩm...</p></div></main>

<div class="ov" id="ov" onclick="if(event.target===this)closeModal()"><div class="box" id="modal"></div></div>

<aside id="cart">
  <div class="row"><b>Giỏ hàng của bạn</b><button class="g" onclick="toggleCart()">Đóng</button></div>
  <div id="items"></div>
  <div class="row"><b>Tổng cộng</b><b class="price" id="total">0 đ</b></div>
  <input id="c-name" placeholder="Họ và tên *">
  <input id="c-phone" placeholder="Số điện thoại *">
  <textarea id="c-addr" rows="2" placeholder="Địa chỉ nhận hàng *"></textarea>
  <textarea id="c-note" rows="1" placeholder="Ghi chú (không bắt buộc)"></textarea>
  <button id="btn-order" onclick="checkout()">ĐẶT HÀNG</button>
</aside>
<div id="toast"></div>

<script>
const SUPABASE_URL='https://uleckabliwereivgxryo.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsZWNrYWJsaXdlcmVpdmd4cnlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzI1NTUsImV4cCI6MjEwNjMwODU1NX0.Sa5fY_OceWa7TI9yqBSMLM24ZTEN6g10j4RrXvENs3o';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let cats=[],products=[],curCat=null,cur=null,curSize=null;
let cart=JSON.parse(localStorage.getItem('lux_cart')||'[]');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Number(n||0).toLocaleString('vi-VN')+' đ';
const imgOf=p=>p.main_image||p.image_url||(p.images||[])[0]||'';
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function toggleCart(){$('cart').classList.toggle('open')}

/* ===== Tải dữ liệu từ Supabase ===== */
async function load(){
  const [c,p]=await Promise.all([
    sb.from('categories').select('*').order('id'),
    sb.from('products').select('*').order('id',{ascending:false})
  ]);
  if(c.error||p.error){$('grid').innerHTML='<p>Không tải được dữ liệu: '+esc((c.error||p.error).message)+'</p>';return}
  cats=c.data;products=p.data;
  renderCats();renderGrid();renderCart();
}

/* ===== Danh mục (nhiều cấp) ===== */
function descendants(id){const r=[id];cats.filter(c=>c.parent_id===id).forEach(c=>r.push(...descendants(c.id)));return r}
function setCat(id){curCat=id;renderCats();renderGrid()}
function renderCats(){
  const btn=c=>`<button class="${curCat===c.id?'on':''}" onclick="setCat(${c.id})">${esc(c.name)}</button>`;
  $('cats').innerHTML=`<button class="${curCat===null?'on':''}" onclick="setCat(null)">Tất cả</button>`+cats.filter(c=>!c.parent_id).map(btn).join('');
  let subs=[];
  if(curCat!==null){
    const me=cats.find(c=>c.id===curCat);
    const hasKids=cats.some(c=>c.parent_id===curCat);
    const parent=hasKids?curCat:(me&&me.parent_id);
    if(parent)subs=cats.filter(c=>c.parent_id===parent);
  }
  $('sub').innerHTML=subs.length?`<nav>${subs.map(btn).join('')}</nav>`:'';
}

/* ===== Danh sách sản phẩm ===== */
function renderGrid(){
  const kw=$('search').value.trim().toLowerCase();
  const ids=curCat===null?null:descendants(curCat);
  const list=products.filter(p=>(!ids||ids.includes(p.category_id))&&p.name.toLowerCase().includes(kw));
  $('grid').innerHTML=list.map(p=>`<div class="card" onclick="openModal(${p.id})">
    <img src="${esc(imgOf(p))}" alt="" loading="lazy">
    <div><b>${esc(p.name)}</b><br><span class="price">${vnd(p.price)}</span>${p.old_price>p.price?`<span class="old">${vnd(p.old_price)}</span>`:''}</div></div>`).join('')||'<p>Không có sản phẩm phù hợp.</p>';
}
$('search').addEventListener('input',renderGrid);

/* ===== Chi tiết sản phẩm ===== */
function openModal(id){
  cur=products.find(p=>p.id===id);curSize=null;
  const imgs=(cur.images&&cur.images.length)?cur.images:[imgOf(cur)];
  const sizes=cur.sizes||[];
  $('modal').innerHTML=`<div><img id="big" src="${esc(imgs[0])}" alt="">
      <div class="thumbs">${imgs.map((u,i)=>`<img src="${esc(u)}" class="${i?'':'on'}" onclick="pickImg(this)">`).join('')}</div></div>
    <div><h2>${esc(cur.name)}</h2>
      <p class="price" style="font-size:20px;margin:8px 0">${vnd(cur.price)}${cur.old_price>cur.price?`<span class="old">${vnd(cur.old_price)}</span>`:''}</p>
      <p style="white-space:pre-line;font-size:14px;color:#555">${esc(cur.description)}</p>
      ${sizes.length?`<p style="margin-top:12px"><b>Chọn size:</b></p><div class="sizes">${sizes.map(s=>`<button onclick="pickSize(this,'${esc(s)}')">${esc(s)}</button>`).join('')}</div>`:''}
      <div style="display:flex;gap:8px;margin-top:14px"><button onclick="addToCart()" style="flex:1">Thêm vào giỏ</button><button class="g" onclick="closeModal()">Đóng</button></div></div>`;
  $('ov').classList.add('open');
}
function closeModal(){$('ov').classList.remove('open')}
function pickImg(el){$('big').src=el.src;document.querySelectorAll('.thumbs img').forEach(i=>i.classList.toggle('on',i===el))}
function pickSize(el,s){curSize=s;document.querySelectorAll('.sizes button').forEach(b=>b.classList.toggle('on',b===el))}

/* ===== Giỏ hàng ===== */
function saveCart(){localStorage.setItem('lux_cart',JSON.stringify(cart));renderCart()}
function addToCart(){
  if((cur.sizes||[]).length&&!curSize)return toast('Vui lòng chọn size');
  const it=cart.find(i=>i.id===cur.id&&i.selectedSize===curSize);
  it?it.qty++:cart.push({id:cur.id,name:cur.name,price:cur.price,image:imgOf(cur),selectedSize:curSize,qty:1});
  saveCart();closeModal();toast('Đã thêm vào giỏ hàng');
}
function chg(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);saveCart()}
function renderCart(){
  $('cnt').textContent=cart.reduce((s,i)=>s+i.qty,0);
  $('items').innerHTML=cart.map((i,k)=>`<div class="row"><img src="${esc(i.image)}" alt="">
    <div style="flex:1"><b>${esc(i.name)}</b>${i.selectedSize?`<br><small>Size: ${esc(i.selectedSize)}</small>`:''}<br><span class="price">${vnd(i.price)}</span></div>
    <div><button class="g" style="padding:3px 9px" onclick="chg(${k},-1)">−</button> ${i.qty} <button class="g" style="padding:3px 9px" onclick="chg(${k},1)">+</button></div></div>`).join('')||'<p style="color:#888">Giỏ hàng trống.</p>';
  $('total').textContent=vnd(cart.reduce((s,i)=>s+i.price*i.qty,0));
}

/* ===== Đặt hàng: ghi vào bảng orders ===== */
async function checkout(){
  if(!cart.length)return toast('Giỏ hàng trống');
  const name=$('c-name').value.trim(),phone=$('c-phone').value.trim(),addr=$('c-addr').value.trim();
  if(!name||!addr)return toast('Vui lòng nhập họ tên và địa chỉ');
  if(!/^(0|\+84)\d{9,10}$/.test(phone.replace(/\s/g,'')))return toast('Số điện thoại không hợp lệ');
  const btn=$('btn-order');btn.disabled=true;btn.textContent='Đang gửi đơn...';
  // Lấy giá hiện tại trong DB thay vì tin giá lưu ở máy khách
  const items=cart.map(i=>{const p=products.find(x=>x.id===i.id);return{...i,price:p?p.price:i.price}});
  const total=items.reduce((s,i)=>s+i.price*i.qty,0);
  const {error}=await sb.from('orders').insert([{
    customer_name:name,customer_phone:phone,address:addr,note:$('c-note').value.trim()||null,
    total_amount:total,
    cart_items:items.map(i=>({id:i.id,name:i.name,price:i.price,selectedSize:i.selectedSize,qty:i.qty}))
  }]);
  btn.disabled=false;btn.textContent='ĐẶT HÀNG';
  if(error)return toast('Lỗi đặt hàng: '+error.message);
  cart=[];saveCart();['c-name','c-phone','c-addr','c-note'].forEach(k=>$(k).value='');
  toggleCart();alert('Đặt hàng thành công! Tổng tiền: '+vnd(total)+'\nChúng tôi sẽ liên hệ xác nhận sớm.');
}

load();
</script>
</body>
</html>
