<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXSTORE - Trang Chủ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .parallax-container {
            perspective: 1000px;
            overflow: hidden;
        }
        .layer {
            transition: transform 0.1s ease-out;
            will-change: transform;
        }
    </style>
</head>
<body class="bg-slate-950 text-white m-0 p-0 min-h-screen flex flex-col items-center justify-between">

    <!-- Header -->
    <header class="w-full max-w-5xl py-6 px-6 flex justify-between items-center border-b border-slate-800">
        <div class="text-xl font-black tracking-widest text-amber-400">LUXSTORE</div>
        <nav class="space-x-6 text-sm text-gray-300">
            <a href="#" class="hover:text-amber-400 transition">Trang Chủ</a>
            <a href="#" class="hover:text-amber-400 transition">Sản Phẩm</a>
            <a href="#" class="hover:text-amber-400 transition">Giới Thiệu</a>
        </nav>
    </header>

    <!-- Main Content with Parallax Effect -->
    <main class="w-full max-w-5xl px-6 py-12 flex flex-col items-center justify-center">
        <div class="parallax-container relative w-full h-[450px] rounded-3xl shadow-2xl border border-slate-800 flex items-center justify-center cursor-pointer group" id="parallaxBox">
            
            <!-- Lớp 1: Hậu cảnh -->
            <div class="layer absolute inset-0 bg-cover bg-center opacity-40 rounded-3xl" style="background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1200&auto=format&fit=crop'); transform: translate(0px, 0px);"></div>

            <!-- Lớp 2: Hiệu ứng chuyển màu -->
            <div class="layer absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/40 to-transparent rounded-3xl"></div>

            <!-- Lớp 3: Nội dung chính -->
            <div class="layer relative z-10 text-center px-6">
                <span class="text-amber-400 text-xs font-bold uppercase tracking-widest bg-amber-400/10 px-4 py-1.5 rounded-full border border-amber-400/20 shadow-lg">
                    ✨ Bộ Sưu Tập Mới 2026
                </span>
                <h1 class="text-4xl sm:text-6xl font-black mt-4 mb-3 tracking-wider bg-gradient-to-r from-white via-gray-200 to-amber-400 bg-clip-text text-transparent">
                    LUXURY PARALLAX
                </h1>
                <p class="text-gray-400 text-sm sm:text-base max-w-lg mx-auto leading-relaxed mb-6">
                    Trải nghiệm không gian giao diện đa lớp sống động. Rê chuột lên khung hình để cảm nhận chiều sâu 3D mượt mà.
                </p>
                <button class="bg-amber-400 hover:bg-amber-500 text-slate-950 font-bold px-8 py-3 rounded-full transition shadow-lg hover:scale-105 transform">
                    Khám Phá Ngay
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-6 text-center text-xs text-gray-500 border-t border-slate-900">
        &copy; 2026 LUXSTORE. Tất cả các quyền được bảo lưu.
    </footer>

    <!-- JavaScript Hiệu ứng Parallax -->
    <script>
        const container = document.getElementById('parallaxBox');
        const layers = container.querySelectorAll('.layer');

        container.addEventListener('mousemove', (e) => {
            const rect = container.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            layers.forEach((layer, index) => {
                const speed = (index + 1) * 12;
                const xOffset = (x * speed) / (rect.width / 2);
                const yOffset = (y * speed) / (rect.height / 2);
                layer.style.transform = `translate(${xOffset}px, ${yOffset}px) scale(1.05)`;
            });
        });

        container.addEventListener('mouseleave', () => {
            layers.forEach(layer => {
                layer.style.transform = `translate(0px, 0px) scale(1)`;
            });
        });
    </script>
</body>
</html>
