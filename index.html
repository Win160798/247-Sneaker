<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXSTORE - Mua Sắm Đẳng Cấp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .variant-btn-active { border-color: #f59e0b !important; background-color: #fffbeb !important; color: #b45309 !important; font-weight: bold; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="#" class="flex items-center space-x-2 text-2xl font-black tracking-widest text-amber-400">
          <i class="fa-solid fa-gem"></i>
          <span>LUXSTORE</span>
        </a>

        <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Tìm kiếm sản phẩm..." class="w-full bg-slate-800 text-sm text-white px-4 py-2 pl-10 rounded-full focus:outline-none focus:ring-2 focus:ring-amber-400 border border-slate-700">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-gray-400 text-sm"></i>
        </div>

        <button onclick="toggleCart(true)" class="relative p-2.5 bg-slate-800 hover:bg-slate-700 rounded-full transition text-amber-400">
          <i class="fa-solid fa-cart-shopping text-lg"></i>
          <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-600 text-white font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BANNER HERO -->
  <section class="bg-gradient-to-r from-slate-950 via-slate-900 to-stone-900 text-white py-10 px-4 text-center">
    <div class="max-w-4xl mx-auto">
      <span class="text-amber-400 text-xs font-bold uppercase tracking-widest bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">Bộ Sưu Tập Mới 2026</span>
      <h1 class="text-3xl sm:text-4xl font-black mt-3 mb-2">ĐẲNG CẤP & TINH TẾ</h1>
      <p class="text-gray-400 text-xs sm:text-sm">Cam kết sản phẩm chính hãng 100% - Bảo hành tận tâm.</p>
    </div>
  </section>

  <!-- MAIN CONTAINER -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <!-- LỌC DANH MỤC -->
    <div class="flex flex-wrap items-center justify-between gap-4 mb-8 pb-4 border-b border-gray-200">
      <div id="categoryTabs" class="flex flex-wrap gap-2">
        <button onclick="filterCategory('ALL', this)" class="cat-btn active bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-full transition shadow">Tất Cả</button>
      </div>
      <div class="text-xs text-gray-500 font-medium">
        Hiển thị: <span id="productCount" class="font-bold text-gray-800">0</span> sản phẩm
      </div>
    </div>

    <!-- DANH SÁCH SẢN PHẨM -->
    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      <div class="col-span-full text-center py-16">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-amber-500"></i>
        <p class="text-xs text-gray-500 mt-2">Đang tải sản phẩm...</p>
      </div>
    </div>
  </main>

  <!-- MODAL CHI TIẾT SẢN PHẨM & CHỌN PHÂN LOẠI -->
  <div id="productDetailModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden relative my-8">
      <button onclick="closeProductDetail()" class="absolute top-4 right-4 z-10 w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full flex items-center justify-center text-lg">&times;</button>

      <div class="flex flex-col md:flex-row p-6 md:p-8 gap-6">
        <div class="w-full md:w-1/2 flex flex-col items-center">
          <div class="w-full h-72 md:h-80 bg-gray-50 rounded-xl border border-gray-100 flex items-center justify-center p-4">
            <img id="detailMainImg" src="" alt="Sản phẩm" class="max-w-full max-h-full object-contain transition-all duration-300">
          </div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col justify-between">
          <div>
            <span id="detailCategory" class="text-xs font-bold text-amber-600 uppercase tracking-widest bg-amber-50 px-2.5 py-1 rounded border border-amber-200">LUXSTORE</span>
            <h2 id="detailTitle" class="text-xl font-black text-gray-900 mt-2 mb-1">Tên sản phẩm</h2>
            <div class="text-2xl font-black text-red-600 mb-4" id="detailPrice">0 ₫</div>

            <!-- KHU VỰC CHỌN PHÂN LOẠI TÙY CHỈNH -->
            <div id="variantSelectionArea" class="mb-5 hidden">
              <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Chọn Phân Loại (Màu, Size,...):</label>
              <div id="variantButtons" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="mb-4">
              <h4 class="text-xs font-bold text-gray-700 uppercase mb-1">Mô Tả:</h4>
              <p id="detailDesc" class="text-xs text-gray-600 leading-relaxed max-h-32 overflow-y-auto">Chưa có mô tả.</p>
            </div>
          </div>

          <button id="detailAddToCartBtn" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3.5 rounded-xl text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-cart-plus"></i>
            <span>THÊM VÀO GIỎ HÀNG</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL GIỎ HÀNG -->
  <div id="cartModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col justify-between shadow-2xl">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-bag-shopping text-amber-400"></i>
          <span>Giỏ Hàng Của Bạn</span>
        </h3>
        <button onclick="toggleCart(false)" class="text-gray-400 hover:text-white text-xl p-1">&times;</button>
      </div>

      <div id="cartContent" class="p-4 flex-1 overflow-y-auto space-y-4"></div>

      <div class="p-4 border-t bg-gray-50 space-y-3">
        <div class="flex justify-between items-center font-bold text-base text-gray-900">
          <span>Tổng thành tiền:</span>
          <span id="cartTotal" class="text-red-600 text-lg">0 ₫</span>
        </div>

        <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-2.5">
          <input type="text" id="cName" required placeholder="Họ và tên người nhận *" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
          <input type="tel" id="cPhone" required placeholder="Số điện thoại *" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
          <input type="text" id="cAddress" required placeholder="Địa chỉ giao hàng *" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
          <textarea id="cNote" placeholder="Ghi chú thêm" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none h-16"></textarea>

          <button type="submit" id="btnSubmitOrder" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3 rounded-lg text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-check-circle"></i>
            <span>XÁC NHẬN ĐẶT HÀNG</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <footer class="bg-slate-950 text-gray-400 text-xs py-6 text-center border-t border-slate-800">
    <p>© 2026 LUXSTORE. All rights reserved.</p>
  </footer>

  <script>
    const SUPABASE_URL = "https://uleckabliwereivgxryo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsZWNrYWJsaXdlcmVpdmd4cnlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzI1NTUsImV4cCI6MjEwNjMwODU1NX0.Sa5fY_OceWa7TI9yqBSMLM24ZTEN6g10j4RrXvENs3o";
    const TELEGRAM_TOKEN = "8715013237:AAHnalBgr7rnIeJewh3GMr_tfFnv8ewJipY";
    const TELEGRAM_CHAT_ID = "8866272456";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let rawProducts = [];
    let categoriesList = [];
    let cart = [];
    let currentCategoryId = 'ALL';
    let selectedVariant = null;
    let currentProduct = null;

    async function fetchCategories() {
      const { data } = await db.from('categories').select('*').order('id', { ascending: true });
      if (data) {
        categoriesList = data;
        const tabsContainer = document.getElementById('categoryTabs');
        tabsContainer.innerHTML = `<button onclick="filterCategory('ALL', this)" class="cat-btn active bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-full transition shadow">Tất Cả</button>`;
        data.forEach(cat => {
          tabsContainer.innerHTML += `<button onclick="filterCategory(${cat.id}, this)" class="cat-btn bg-white text-gray-700 hover:bg-gray-100 text-xs font-semibold px-4 py-2 rounded-full border transition">${cat.name}</button>`;
        });
      }
    }

    async function fetchProducts() {
      try {
        const { data, error } = await db.from('products').select('*, product_variants(*)').order('id', { ascending: false });
        if (error) throw error;
        rawProducts = data || [];
        renderProducts();
      } catch (err) {
        document.getElementById('productGrid').innerHTML = `<div class="col-span-full text-center py-16 text-red-500 text-xs">Không thể kết nối dữ liệu sản phẩm!</div>`;
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      const searchKey = document.getElementById('searchInput').value.toLowerCase();

      let filtered = rawProducts.filter(p => {
        const matchCat = currentCategoryId === 'ALL' || p.category_id == currentCategoryId;
        const matchSearch = p.name ? p.name.toLowerCase().includes(searchKey) : false;
        return matchCat && matchSearch;
      });

      document.getElementById('productCount').innerText = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400 text-xs">Không tìm thấy sản phẩm phù hợp.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(p => {
        const price = Number(p.price || 0);
        const catObj = categoriesList.find(c => c.id == p.category_id);
        const hasVariants = p.product_variants && p.product_variants.length > 0;

        return `
          <div onclick="openProductDetail(${p.id})" class="bg-white rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition overflow-hidden flex flex-col justify-between group cursor-pointer">
            <div class="relative overflow-hidden bg-gray-100 aspect-square">
              <img src="${p.main_image || p.image_url}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
              ${hasVariants ? `<span class="absolute top-2 right-2 bg-amber-500 text-slate-950 font-black text-[10px] px-2 py-0.5 rounded-full shadow">Nhiều phân loại</span>` : ''}
            </div>
            <div class="p-3.5 flex-1 flex flex-col justify-between">
              <div>
                <span class="text-[10px] font-bold text-amber-600 uppercase tracking-wider">${catObj ? catObj.name : 'LUXSTORE'}</span>
                <h3 class="font-bold text-xs text-gray-800 line-clamp-2 mt-1">${p.name}</h3>
              </div>
              <div class="mt-3">
                <div class="text-sm font-black text-red-600">${price.toLocaleString('vi-VN')} ₫</div>
                <button onclick="event.stopPropagation(); openProductDetail(${p.id})" class="mt-2.5 w-full bg-slate-900 hover:bg-amber-500 hover:text-slate-950 text-white text-xs font-bold py-2 rounded-lg transition flex items-center justify-center gap-1">
                  <i class="fa-solid fa-eye text-[10px]"></i> Xem & Chọn Phân Loại
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openProductDetail(id) {
      currentProduct = rawProducts.find(item => item.id === id);
      if (!currentProduct) return;

      const catObj = categoriesList.find(c => c.id == currentProduct.category_id);
      document.getElementById('detailTitle').innerText = currentProduct.name;
      document.getElementById('detailCategory').innerText = catObj ? catObj.name : 'LUXSTORE';
      document.getElementById('detailDesc').innerText = currentProduct.description || 'Chưa có mô tả chi tiết.';

      const variantArea = document.getElementById('variantSelectionArea');
      const variantButtons = document.getElementById('variantButtons');
      const vars = currentProduct.product_variants || [];

      if (vars.length > 0) {
        variantArea.classList.remove('hidden');
        variantButtons.innerHTML = vars.map((v, idx) => `
          <button onclick="selectVariant(${idx})" class="variant-btn border border-gray-300 text-xs px-3 py-1.5 rounded-lg hover:border-amber-500 transition">
            ${v.attribute_name} - ${Number(v.price).toLocaleString('vi-VN')}₫
          </button>
        `).join('');
        
        selectVariant(0);
      } else {
        variantArea.classList.add('hidden');
        selectedVariant = null;
        document.getElementById('detailMainImg').src = currentProduct.main_image || currentProduct.image_url;
        document.getElementById('detailPrice').innerText = Number(currentProduct.price).toLocaleString('vi-VN') + ' ₫';
      }

      document.getElementById('detailAddToCartBtn').onclick = function() {
        addToCartWithVariant();
        closeProductDetail();
      };

      document.getElementById('productDetailModal').classList.remove('hidden');
    }

    function selectVariant(idx) {
      const vars = currentProduct.product_variants || [];
      selectedVariant = vars[idx];

      document.getElementById('detailMainImg').src = selectedVariant.image_url || currentProduct.main_image;
      document.getElementById('detailPrice').innerText = Number(selectedVariant.price).toLocaleString('vi-VN') + ' ₫';

      const btns = document.querySelectorAll('.variant-btn');
      btns.forEach((btn, i) => {
        if (i === idx) btn.classList.add('variant-btn-active');
        else btn.classList.remove('variant-btn-active');
      });
    }

    function closeProductDetail() { document.getElementById('productDetailModal').classList.add('hidden'); }

    function addToCartWithVariant() {
      if (!currentProduct) return;

      const cartItemId = selectedVariant ? `${currentProduct.id}_${selectedVariant.id}` : `${currentProduct.id}_default`;
      const itemPrice = selectedVariant ? Number(selectedVariant.price) : Number(currentProduct.price);
      const itemImg = selectedVariant ? selectedVariant.image_url : (currentProduct.main_image || currentProduct.image_url);
      const variantName = selectedVariant ? selectedVariant.attribute_name : null;

      const existingIndex = cart.findIndex(i => i.cartItemId === cartItemId);
      if (existingIndex > -1) {
        cart[existingIndex].qty++;
      } else {
        cart.push({
          cartItemId: cartItemId,
          id: currentProduct.id,
          name: currentProduct.name,
          price: itemPrice,
          image: itemImg,
          selectedVariant: variantName,
          qty: 1
        });
      }

      updateCartUI();
      toggleCart(true);
    }

    function changeQty(cartItemId, delta) {
      const item = cart.find(i => i.cartItemId === cartItemId);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) cart = cart.filter(i => i.cartItemId !== cartItemId);
      updateCartUI();
    }

    function updateCartUI() {
      const totalBadge = cart.reduce((sum, i) => sum + i.qty, 0);
      document.getElementById('cartBadge').innerText = totalBadge;

      const container = document.getElementById('cartContent');
      let totalMoney = 0;

      if (cart.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-gray-400 text-xs">Giỏ hàng đang trống.</div>`;
        document.getElementById('cartTotal').innerText = '0 ₫';
        return;
      }

      container.innerHTML = cart.map(i => {
        const itemTotal = i.price * i.qty;
        totalMoney += itemTotal;
        return `
          <div class="flex items-center gap-3 p-2 border-b">
            <img src="${i.image}" class="w-12 h-12 object-cover rounded bg-gray-100">
            <div class="flex-1">
              <h4 class="font-bold text-xs text-gray-800 line-clamp-1">${i.name}</h4>
              ${i.selectedVariant ? `<p class="text-[10px] text-amber-600 font-bold">Phân loại: ${i.selectedVariant}</p>` : ''}
              <span class="text-xs text-red-600 font-bold">${i.price.toLocaleString('vi-VN')} ₫</span>
            </div>
            <div class="flex items-center gap-2 border rounded px-1.5 py-0.5">
              <button onclick="changeQty('${i.cartItemId}', -1)" class="text-xs font-bold px-1 text-gray-500">-</button>
              <span class="text-xs font-bold">${i.qty}</span>
              <button onclick="changeQty('${i.cartItemId}', 1)" class="text-xs font-bold px-1 text-gray-500">+</button>
            </div>
          </div>
        `;
      }).join('');

      document.getElementById('cartTotal').innerText = totalMoney.toLocaleString('vi-VN') + ' ₫';
    }

    function toggleCart(show) { document.getElementById('cartModal').classList.toggle('hidden', !show); }

    function filterCategory(catId, btnEl) {
      currentCategoryId = catId;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-slate-900', 'text-white', 'shadow');
        btn.classList.add('bg-white', 'text-gray-700');
      });
      if (btnEl) {
        btnEl.classList.add('bg-slate-900', 'text-white', 'shadow');
        btnEl.classList.remove('bg-white', 'text-gray-700');
      }
      renderProducts();
    }

    function handleSearch() { renderProducts(); }

    async function submitOrder(e) {
      e.preventDefault();
      if (cart.length === 0) return alert('Giỏ hàng trống!');

      const btn = document.getElementById('btnSubmitOrder');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ĐANG XỬ LÝ...`;

      const name = document.getElementById('cName').value;
      const phone = document.getElementById('cPhone').value;
      const address = document.getElementById('cAddress').value;
      const note = document.getElementById('cNote').value;
      const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);

      const { error } = await db.from('orders').insert([{
        customer_name: name,
        customer_phone: phone,
        address: address,
        note: note,
        total_amount: total,
        cart_items: cart
      }]);

      if (!error) {
        const itemsText = cart.map(i => `• <b>${i.name}</b> ${i.selectedVariant ? `(Phân loại: ${i.selectedVariant})` : ''} - (x${i.qty}) - ${(i.price * i.qty).toLocaleString('vi-VN')}₫`).join('\n');
        const telegramMsg = `🚨 <b>ĐƠN HÀNG MỚI TỪ WEBSITE!</b>\n\n👤 <b>Khách hàng:</b> ${name}\n📞 <b>Điện thoại:</b> ${phone}\n🏠 <b>Địa chỉ:</b> ${address}\n📝 <b>Ghi chú:</b> ${note || 'Không có'}\n\n📦 <b>Sản phẩm:</b>\n${itemsText}\n\n💰 <b>TỔNG CỘNG:</b> ${total.toLocaleString('vi-VN')} ₫`;

        try {
          await fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: telegramMsg, parse_mode: 'HTML' })
          });
        } catch (tgErr) { console.error(tgErr); }

        alert('🎉 Đặt hàng thành công! Chúng tôi sẽ gọi xác nhận ngay.');
        cart = [];
        updateCartUI();
        toggleCart(false);
        document.getElementById('checkoutForm').reset();
      } else {
        alert('Lỗi lưu đơn hàng: ' + error.message);
      }

      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> XÁC NHẬN ĐẶT HÀNG`;
    }

    async function init() {
      await fetchCategories();
      await fetchProducts();
    }
    init();
  </script>
</body>
</html>
