<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXSTORE - Mua Sắm Đẳng Cấp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .thumb-active { border-color: #f59e0b !important; ring-width: 2px; box-shadow: 0 0 8px rgba(245, 158, 11, 0.5); }
    .size-btn-active { background-color: #f59e0b !important; color: #0f172a !important; font-weight: bold; border-color: #f59e0b !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">

  <!-- HEADER -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-lg border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <a href="#" class="flex items-center space-x-2 text-2xl font-black tracking-widest text-amber-400">
          <i class="fa-solid fa-gem"></i>
          <span>LUXSTORE</span>
        </a>

        <div class="hidden md:flex flex-1 max-w-md mx-8 relative">
          <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Tìm kiếm sản phẩm..." class="w-full bg-slate-800 text-sm text-white px-4 py-2 pl-10 rounded-full focus:outline-none focus:ring-2 focus:ring-amber-400 border border-slate-700">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-gray-400 text-sm"></i>
        </div>

        <button onclick="toggleCart(true)" class="relative p-2.5 bg-slate-800 hover:bg-slate-700 rounded-full transition text-amber-400">
          <i class="fa-solid fa-cart-shopping text-lg"></i>
          <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-600 text-white font-bold text-xs w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- BANNER -->
  <section class="bg-gradient-to-r from-slate-950 via-slate-900 to-stone-900 text-white py-10 px-4 text-center">
    <div class="max-w-4xl mx-auto">
      <span class="text-amber-400 text-xs font-bold uppercase tracking-widest bg-amber-400/10 px-3 py-1 rounded-full border border-amber-400/20">Bộ Sưu Tập Mới 2026</span>
      <h1 class="text-3xl sm:text-4xl font-black mt-3 mb-2">ĐẲNG CẤP & TINH TẾ</h1>
      <p class="text-gray-400 text-xs sm:text-sm">Cam kết sản phẩm chính hãng 100% - Bảo hành tận tâm.</p>
    </div>
  </section>

  <!-- MAIN -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
    
    <div class="flex flex-col md:flex-row items-center justify-between gap-4 mb-8 pb-4 border-b border-gray-200">
      <div id="categoryTabs" class="flex flex-wrap gap-2 w-full md:w-auto">
        <button onclick="filterCategory('ALL', this)" class="cat-btn active bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-full transition shadow">Tất Cả</button>
      </div>
      
      <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
        <div class="text-xs text-gray-500 font-medium">
          Hiển thị: <span id="productCount" class="font-bold text-gray-800">0</span> sản phẩm
        </div>
        <select id="sortSelect" onchange="renderProducts()" class="bg-white border border-gray-300 text-xs font-semibold px-3 py-2 rounded-lg outline-none focus:ring-2 focus:ring-amber-500">
          <option value="default">Sắp xếp: Mặc định (Sát từ khóa nhất)</option>
          <option value="price-asc">Giá: Thấp đến Cao</option>
          <option value="price-desc">Giá: Cao đến Thấp</option>
        </select>
      </div>
    </div>

    <div id="productGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      <div class="col-span-full text-center py-16">
        <i class="fa-solid fa-circle-notch fa-spin text-3xl text-amber-500"></i>
        <p class="text-xs text-gray-500 mt-2">Đang tải sản phẩm...</p>
      </div>
    </div>
  </main>

  <!-- MODAL CHI TIẾT SẢN PHẨM -->
  <div id="productDetailModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden relative my-8">
      <button onclick="closeProductDetail()" class="absolute top-4 right-4 z-10 w-9 h-9 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-full flex items-center justify-center text-lg">&times;</button>

      <div class="flex flex-col md:flex-row p-6 md:p-8 gap-6">
        <div class="w-full md:w-1/2 flex flex-col items-center">
          <div class="w-full h-72 md:h-80 bg-gray-50 rounded-xl border border-gray-100 flex items-center justify-center p-2 relative overflow-hidden group">
            <img id="detailMainImg" src="" alt="Sản phẩm" class="max-w-full max-h-full object-contain transition-all duration-300">
          </div>
          <div id="galleryThumbnails" class="flex flex-wrap gap-1.5 mt-3 max-h-36 overflow-y-auto w-full p-1 border rounded-lg bg-gray-50"></div>
        </div>

        <div class="w-full md:w-1/2 flex flex-col justify-between">
          <div>
            <span id="detailCategory" class="text-xs font-bold text-amber-600 uppercase tracking-widest bg-amber-50 px-2.5 py-1 rounded border border-amber-200">LUXSTORE</span>
            <h2 id="detailTitle" class="text-xl font-black text-gray-900 mt-2 mb-1">Tên sản phẩm</h2>
            <div class="text-2xl font-black text-red-600 mb-4" id="detailPrice">0 ₫</div>

            <div id="sizeSelectionArea" class="mb-5 hidden">
              <label class="block text-xs font-bold text-gray-700 uppercase mb-2">Chọn Size:</label>
              <div id="sizeButtons" class="flex flex-wrap gap-2"></div>
            </div>

            <div class="mb-4">
              <h4 class="text-xs font-bold text-gray-700 uppercase mb-1">Mô Tả:</h4>
              <p id="detailDesc" class="text-xs text-gray-600 leading-relaxed max-h-28 overflow-y-auto">Chưa có mô tả.</p>
            </div>
          </div>

          <button id="detailAddToCartBtn" onclick="addToCartFromDetail()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3.5 rounded-xl text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-cart-plus"></i>
            <span>THÊM VÀO GIỎ HÀNG</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL GIỎ HÀNG -->
  <div id="cartModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex justify-end">
    <div class="bg-white w-full max-w-md h-full flex flex-col justify-between shadow-2xl">
      <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-bag-shopping text-amber-400"></i>
          <span>Giỏ Hàng Của Bạn</span>
        </h3>
        <button onclick="toggleCart(false)" class="text-gray-400 hover:text-white text-xl p-1">&times;</button>
      </div>

      <div id="cartContent" class="p-4 flex-1 overflow-y-auto space-y-4"></div>

      <div class="p-4 border-t bg-gray-50 space-y-3">
        <div class="flex justify-between items-center font-bold text-base text-gray-900">
          <span>Tổng thành tiền:</span>
          <span id="cartTotal" class="text-red-600 text-lg">0 ₫</span>
        </div>

        <form id="checkoutForm" onsubmit="submitOrder(event)" class="space-y-2.5">
          <input type="text" id="cName" required placeholder="Họ và tên người nhận *" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
          <input type="tel" id="cPhone" required placeholder="Số điện thoại *" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
          <input type="text" id="cAddress" required placeholder="Địa chỉ giao hàng *" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none">
          <textarea id="cNote" placeholder="Ghi chú thêm" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-slate-800 outline-none h-16"></textarea>

          <button type="submit" id="btnSubmitOrder" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-black py-3 rounded-lg text-xs uppercase tracking-wider transition shadow-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-check-circle"></i>
            <span>XÁC NHẬN ĐẶT HÀNG</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <footer class="bg-slate-950 text-gray-400 text-xs py-6 text-center border-t border-slate-800">
    <p>© 2026 LUXSTORE. All rights reserved.</p>
  </footer>

  <script>
    const SUPABASE_URL = "https://uleckabliwereivgxryo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsZWNrYWJsaXdlcmVpdmd4cnlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzI1NTUsImV4cCI6MjEwNjMwODU1NX0.Sa5fY_OceWa7TI9yqBSMLM24ZTEN6g10j4RrXvENs3o";

    const TELEGRAM_BOT_TOKEN = "8715013237:AAHnalBgr7rnIeJewh3GMr_tfFnv8ewJipY";
    const TELEGRAM_CHAT_ID = "8866272456";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let rawProducts = [];
    let categoriesList = [];
    let cart = JSON.parse(localStorage.getItem('luxstore_cart')) || [];
    let currentCategoryId = 'ALL';
    let currentProduct = null;
    let selectedImageIndex = 0;
    let selectedSize = null;

    // Khởi động ứng dụng
    window.addEventListener('DOMContentLoaded', () => {
      fetchCategories();
      fetchProducts();
      updateCartBadge();
    });

    async function fetchCategories() {
      try {
        const { data, error } = await db.from('categories').select('*').order('id', { ascending: true });
        if (error) throw error;
        categoriesList = data || [];
        renderCategoryTabs();
      } catch (err) {
        console.error('Lỗi tải danh mục:', err);
      }
    }

    async function fetchProducts() {
      try {
        const { data, error } = await db.from('products').select('*').order('id', { ascending: false });
        if (error) throw error;
        rawProducts = data || [];
        renderProducts();
      } catch (err) {
        console.error('Lỗi tải sản phẩm:', err);
        document.getElementById('productGrid').innerHTML = `
          <div class="col-span-full text-center py-12 text-red-500 text-xs">
            Không thể tải dữ liệu sản phẩm. Vui lòng kiểm tra lại kết nối.
          </div>`;
      }
    }

    function renderCategoryTabs() {
      const container = document.getElementById('categoryTabs');
      let html = `<button onclick="filterCategory('ALL', this)" class="cat-btn ${currentCategoryId === 'ALL' ? 'bg-slate-900 text-white shadow' : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-200'} text-xs font-semibold px-4 py-2 rounded-full transition">Tất Cả</button>`;
      
      categoriesList.forEach(cat => {
        const isActive = currentCategoryId === String(cat.id);
        html += `<button onclick="filterCategory('${cat.id}', this)" class="cat-btn ${isActive ? 'bg-slate-900 text-white shadow' : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-200'} text-xs font-semibold px-4 py-2 rounded-full transition">${cat.name}</button>`;
      });
      container.innerHTML = html;
    }

    function filterCategory(catId, btnElement) {
      currentCategoryId = catId;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = "cat-btn bg-white text-gray-700 hover:bg-gray-100 border border-gray-200 text-xs font-semibold px-4 py-2 rounded-full transition";
      });
      btnElement.className = "cat-btn bg-slate-900 text-white text-xs font-semibold px-4 py-2 rounded-full transition shadow";
      renderProducts();
    }

    function handleSearch() {
      renderProducts();
    }

    function renderProducts() {
      const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
      const sortType = document.getElementById('sortSelect').value;

      let filtered = rawProducts.filter(item => {
        const matchCat = currentCategoryId === 'ALL' || String(item.category_id) === String(currentCategoryId);
        const matchKey = !keyword || (item.title && item.title.toLowerCase().includes(keyword)) || (item.description && item.description.toLowerCase().includes(keyword));
        return matchCat && matchKey;
      });

      // Sắp xếp
      if (sortType === 'price-asc') {
        filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
      } else if (sortType === 'price-desc') {
        filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
      }

      document.getElementById('productCount').innerText = filtered.length;
      const grid = document.getElementById('productGrid');

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full text-center py-16 text-gray-400 text-xs">
            <i class="fa-solid fa-box-open text-3xl mb-2"></i>
            <p>Không tìm thấy sản phẩm phù hợp.</p>
          </div>`;
        return;
      }

      let html = '';
      filtered.forEach(p => {
        let imageUrl = 'https://via.placeholder.com/300?text=No+Image';
        if (p.images) {
          if (Array.isArray(p.images) && p.images.length > 0) imageUrl = p.images[0];
          else if (typeof p.images === 'string') {
            try {
              const parsed = JSON.parse(p.images);
              if (Array.isArray(parsed) && parsed.length > 0) imageUrl = parsed[0];
            } catch(e) { imageUrl = p.images; }
          }
        }

        const formattedPrice = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(p.price || 0);

        html += `
          <div onclick="openProductDetail(${p.id})" class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm hover:shadow-md transition cursor-pointer flex flex-col justify-between group">
            <div class="w-full h-48 sm:h-56 bg-gray-100 overflow-hidden relative">
              <img src="${imageUrl}" alt="${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
            </div>
            <div class="p-3.5 flex flex-col flex-1 justify-between">
              <div>
                <h3 class="text-xs font-bold text-gray-900 line-clamp-2 mb-1 group-hover:text-amber-600 transition">${p.title || ''}</h3>
              </div>
              <div class="mt-2 flex items-center justify-between">
                <span class="text-xs font-black text-red-600">${formattedPrice}</span>
                <span class="text-[10px] bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded font-semibold">Xem chi tiết</span>
              </div>
            </div>
          </div>
        `;
      });
      grid.innerHTML = html;
    }

    function openProductDetail(productId) {
      currentProduct = rawProducts.find(p => p.id === productId);
      if (!currentProduct) return;

      document.getElementById('detailTitle').innerText = currentProduct.title || '';
      document.getElementById('detailPrice').innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(currentProduct.price || 0);
      document.getElementById('detailDesc').innerText = currentProduct.description || 'Chưa có mô tả.';
      
      const cat = categoriesList.find(c => String(c.id) === String(currentProduct.category_id));
      document.getElementById('detailCategory').innerText = cat ? cat.name : 'LUXSTORE';

      // Xử lý hình ảnh (có thể là mảng hoặc chuỗi JSON)
      let imgs = [];
      if (currentProduct.images) {
        if (Array.isArray(currentProduct.images)) imgs = currentProduct.images;
        else {
          try { imgs = JSON.parse(currentProduct.images); }
          catch(e) { imgs = [currentProduct.images]; }
        }
      }
      if (imgs.length === 0) imgs = ['https://via.placeholder.com/300?text=No+Image'];

      selectedImageIndex = 0;
      document.getElementById('detailMainImg').src = imgs[0];

      let thumbHtml = '';
      imgs.forEach((imgSrc, idx) => {
        thumbHtml += `<img src="${imgSrc}" onclick="changeDetailImage(${idx}, '${imgSrc}')" id="thumb-${idx}" class="w-12 h-12 object-cover rounded cursor-pointer border ${idx === 0 ? 'thumb-active' : 'border-gray-200'} hover:opacity-80 transition">`;
      });
      document.getElementById('galleryThumbnails').innerHTML = thumbHtml;

      // Xử lý Size nếu có
      const sizeArea = document.getElementById('sizeSelectionArea');
      const sizeButtons = document.getElementById('sizeButtons');
      selectedSize = null;

      let sizes = [];
      if (currentProduct.sizes) {
        if (Array.isArray(currentProduct.sizes)) sizes = currentProduct.sizes;
        else {
          try { sizes = JSON.parse(currentProduct.sizes); }
          catch(e) { sizes = currentProduct.sizes.split(',').map(s => s.trim()); }
        }
      }

      if (sizes && sizes.length > 0) {
        sizeArea.classList.remove('hidden');
        let sHtml = '';
        sizes.forEach((s, idx) => {
          sHtml += `<button type="button" onclick="selectSize('${s}', this)" class="size-btn px-3.5 py-1.5 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:border-amber-500 transition ${idx === 0 ? 'size-btn-active' : ''}">${s}</button>`;
        });
        sizeButtons.innerHTML = sHtml;
        selectedSize = sizes[0];
      } else {
        sizeArea.classList.add('hidden');
        sizeButtons.innerHTML = '';
      }

      document.getElementById('productDetailModal').classList.remove('hidden');
    }

    function changeDetailImage(index, src) {
      selectedImageIndex = index;
      document.getElementById('detailMainImg').src = src;
      document.querySelectorAll('#galleryThumbnails img').forEach((img, idx) => {
        if (idx === index) img.classList.add('thumb-active');
        else img.classList.remove('thumb-active');
      });
    }

    function selectSize(sizeValue, btnElement) {
      selectedSize = sizeValue;
      document.querySelectorAll('.size-btn').forEach(btn => {
        btn.className = "size-btn px-3.5 py-1.5 border border-gray-300 rounded-lg text-xs font-semibold text-gray-700 hover:border-amber-500 transition";
      });
      btnElement.className = "size-btn size-btn-active px-3.5 py-1.5 border rounded-lg text-xs font-semibold transition";
    }

    function closeProductDetail() {
      document.getElementById('productDetailModal').classList.add('hidden');
    }

    function addToCartFromDetail() {
      if (!currentProduct) return;

      let imgs = [];
      if (currentProduct.images) {
        if (Array.isArray(currentProduct.images)) imgs = currentProduct.images;
        else {
          try { imgs = JSON.parse(currentProduct.images); } catch(e) { imgs = [currentProduct.images]; }
        }
      }
      const image = imgs[selectedImageIndex] || imgs[0] || '';

      const cartItemKey = `${currentProduct.id}-${selectedSize || 'nosize'}`;
      const existingIndex = cart.findIndex(item => item.cartKey === cartItemKey);

      if (existingIndex > -1) {
        cart[existingIndex].quantity += 1;
      } else {
        cart.push({
          cartKey: cartItemKey,
          id: currentProduct.id,
          title: currentProduct.title,
          price: currentProduct.price,
          image: image,
          size: selectedSize || null,
          quantity: 1
        });
      }

      saveCart();
      closeProductDetail();
      toggleCart(true);
    }

    function toggleCart(isOpen) {
      const modal = document.getElementById('cartModal');
      if (isOpen) {
        modal.classList.remove('hidden');
        renderCartContent();
      } else {
        modal.classList.add('hidden');
      }
    }

    function changeQuantity(cartKey, delta) {
      const item = cart.find(i => i.cartKey === cartKey);
      if (!item) return;
      item.quantity += delta;
      if (item.quantity <= 0) {
        cart = cart.filter(i => i.cartKey !== cartKey);
      }
      saveCart();
      renderCartContent();
    }

    function removeFromCart(cartKey) {
      cart = cart.filter(i => i.cartKey !== cartKey);
      saveCart();
      renderCartContent();
    }

    function saveCart() {
      localStorage.setItem('luxstore_cart', JSON.stringify(cart));
      updateCartBadge();
    }

    function updateCartBadge() {
      const totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
      document.getElementById('cartBadge').innerText = totalQty;
    }

    function renderCartContent() {
      const container = document.getElementById('cartContent');
      if (cart.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-gray-400 text-xs">
            <i class="fa-solid fa-cart-arrow-down text-3xl mb-2"></i>
            <p>Giỏ hàng của bạn đang trống.</p>
          </div>`;
        document.getElementById('cartTotal').innerText = '0 ₫';
        return;
      }

      let html = '';
      let total = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.quantity;
        total += itemTotal;
        const formattedPrice = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(item.price);
        const formattedTotal = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(itemTotal);

        html += `
          <div class="flex items-center gap-3 p-2.5 bg-gray-50 border border-gray-200 rounded-xl">
            <img src="${item.image}" alt="${item.title}" class="w-16 h-16 object-cover rounded-lg border">
            <div class="flex-1">
              <h4 class="text-xs font-bold text-gray-900 line-clamp-1">${item.title}</h4>
              ${item.size ? `<p class="text-[10px] text-gray-500 font-medium">Size: ${item.size}</p>` : ''}
              <div class="text-xs font-black text-red-600 mt-0.5">${formattedPrice}</div>
              
              <div class="flex items-center justify-between mt-2">
                <div class="flex items-center border border-gray-300 rounded bg-white">
                  <button type="button" onclick="changeQuantity('${item.cartKey}', -1)" class="px-2 py-0.5 text-xs text-gray-600 hover:bg-gray-100">-</button>
                  <span class="px-2.5 text-xs font-bold">${item.quantity}</span>
                  <button type="button" onclick="changeQuantity('${item.cartKey}', 1)" class="px-2 py-0.5 text-xs text-gray-600 hover:bg-gray-100">+</button>
                </div>
                <button type="button" onclick="removeFromCart('${item.cartKey}')" class="text-gray-400 hover:text-red-600 text-xs transition"><i class="fa-solid fa-trash"></i></button>
              </div>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      document.getElementById('cartTotal').innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(total);
    }

    async function submitOrder(e) {
      e.preventDefault();
      if (cart.length === 0) {
        alert('Giỏ hàng trống!');
        return;
      }

      const name = document.getElementById('cName').value.trim();
      const phone = document.getElementById('cPhone').value.trim();
      const address = document.getElementById('cAddress').value.trim();
      const note = document.getElementById('cNote').value.trim();

      const btn = document.getElementById('btnSubmitOrder');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>ĐANG GỬI ĐƠN HÀNG...</span>`;

      let orderDetailsText = "";
      let totalAmount = 0;

      cart.forEach((item, index) => {
        const sub = item.price * item.quantity;
        totalAmount += sub;
        orderDetailsText += `\n${index + 1}. *${item.title}* ${item.size ? `(Size: ${item.size})` : ''} \n   - SL: ${item.quantity} x ${item.price.toLocaleString()}đ = *${sub.toLocaleString()}đ*`;
      });

      const formattedTotal = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(totalAmount);

      const telegramMessage = `🛍️ *ĐƠN HÀNG MỚI TỪ LUXSTORE* 🛍️\n\n👤 *Khách hàng:* ${name}\n📞 *Điện thoại:* ${phone}\n📍 *Địa chỉ:* ${address}\n📝 *Ghi chú:* ${note || 'Không có'}\n\n📦 *Chi tiết đơn hàng:*${orderDetailsText}\n\n💰 *Tổng tiền:* *${formattedTotal}*`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: telegramMessage,
            parse_mode: 'Markdown'
          })
        });

        const resData = await response.json();
        if (resData.ok) {
          alert('Đặt hàng thành công! Cửa hàng sẽ liên hệ với bạn sớm nhất.');
          cart = [];
          saveCart();
          document.getElementById('checkoutForm').reset();
          toggleCart(false);
        } else {
          throw new Error(resData.description || 'Lỗi gửi Telegram');
        }
      } catch (err) {
        console.error('Lỗi khi đặt hàng:', err);
        alert('Có lỗi xảy ra khi đặt hàng. Vui lòng thử lại sau.');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> <span>XÁC NHẬN ĐẶT HÀNG</span>`;
      }
    }
  </script>
</body>
</html>
