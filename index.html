<script>
  // đổi "36u" -> calc(36*var(--u))
  const _s = document.querySelector('style[type="text/u"]').textContent;
  const _e = document.createElement('style');
  _e.textContent = _s.replace(/(?<![\w.#-])(-?\d*\.?\d+)u(?![\w-])/g, 'calc($1*var(--u))');
  document.head.appendChild(_e);
</script>

    $('tsx').textContent = tsCss();

  /* ---------- Các khối giao diện (data-* để trình chỉnh sửa trực tiếp nhận ra chữ / ảnh / link / bản đồ) ---------- */
  const PG = ['home', 'products', 'size', 'contact'];
  const sb = n => (cfg.sbg && cfg.sbg[n]) ? ` style="background:${esc(cfg.sbg[n])}"` : '';
  const im = (u, p) => `<img data-img="${p}" src="${esc(U(u))}" alt="" loading="lazy">`;
  const gal = (a, n) => `<section class="gal" data-sec="${n}"${sb(n)}><div class="in">${a.map((u, i) => im(u, `${n}.${i}`)).join('')}</div></section>`;
  // Bản đồ Google Maps nhúng: nhập địa chỉ/từ khóa, hoặc dán link/mã nhúng Google Maps
  const mapSrc = q => {
    q = String(q || ''); const m = q.match(/src=["']([^"']+)["']/);
    if (m) return m[1];
    if (/^https?:\/\//.test(q)) return q;
    return 'https://www.google.com/maps?q=' + encodeURIComponent(q) + '&hl=vi&z=16&output=embed';
  };
  const SEC = {
    hero: () => `<section class="blue hero" data-sec="hero"${sb('hero')}><div class="in"><div class="ph">${cfg.hero.map((u, i) => im(u, `hero.${i}`)).join('')}</div>
      <svg class="big" data-k="big" viewBox="0 -15 1024 190"><text x="45" y="160" font-size="223" textLength="${Math.min(939, Math.max(1, cfg.big.length) * 134)}" lengthAdjust="spacingAndGlyphs">${esc(cfg.big)}</text></svg></div></section>`,
    gal: () => gal(cfg.gal, 'gal'),
    gal2: () => gal(cfg.gal2, 'gal2'),
    prod: () => `<section class="blue sec" id="prod" data-sec="prod"${sb('prod')}><div class="in"><h2 class="ttl" data-k="prodTitle">${esc(cfg.prodTitle)}</h2>
      <div class="bar"><div id="chips"></div><div class="dd" id="sortdd"><button type="button" class="dd-b" id="sort-b" aria-haspopup="listbox"></button><ul class="dd-l" id="sort-l" hidden><li data-v="">Mới nhất</li><li data-v="asc">Giá: thấp → cao</li><li data-v="desc">Giá: cao → thấp</li></ul></div></div>
      <div class="grid" id="grid"></div></div></section>`,
    size: () => {
      const h = cfg.sizeHead, n = Math.max(cfg.sizeM.length, cfg.sizeF.length);
      const r = (a, p, i) => a[i] ? `<td data-li="${p}.${i}" data-k="${p}.${i}.k">${esc(a[i].k)}</td><td data-li="${p}.${i}" data-k="${p}.${i}.s">${esc(a[i].s)}</td>` : '<td></td><td></td>';
      return `<section class="sz" data-sec="size"${sb('size')}><div class="in"><h2 class="ttl" data-k="sizeTitle">${esc(cfg.sizeTitle)}</h2><table>
        <tr><th colspan="2" data-k="sizeHead.0">${esc(h[0])}</th><th colspan="2" data-k="sizeHead.1">${esc(h[1])}</th></tr>
        <tr><th data-k="sizeHead.2">${esc(h[2])}</th><th data-k="sizeHead.3">${esc(h[3])}</th><th data-k="sizeHead.2">${esc(h[2])}</th><th data-k="sizeHead.3">${esc(h[3])}</th></tr>
        ${Array.from({ length: n }, (_, i) => `<tr>${r(cfg.sizeM, 'sizeM', i)}${r(cfg.sizeF, 'sizeF', i)}</tr>`).join('')}</table></div></section>`;
    },
    stores: () => `<section class="blue stores" data-sec="stores"${sb('stores')}><div class="in"><h2 class="ttl" data-k="storeTitle">${esc(cfg.storeTitle)}</h2><div class="st">${cfg.stores.map((s, i) => `
      <div data-li="stores.${i}"><div class="mapw" data-map="stores.${i}.q"><iframe class="mp" src="${esc(mapSrc(s.q || s.addr))}" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="Bản đồ"></iframe></div>
      <a class="sa" data-lk="stores.${i}.link" href="${esc(s.link || gm(s.q || s.addr))}" target="_blank" rel="noopener">${im(cfg.homeIcon, 'homeIcon')}<span data-k="stores.${i}.addr">${esc(s.addr)}</span></a></div>`).join('')}</div></div></section>`,
    contact: () => `<section class="wh" data-sec="contact"${sb('contact')}><div class="in"><div class="ct">${im(cfg.logo, 'logo').replace('<img', '<img class="lg"')}<div>${cfg.contacts.map((c, i) => `
      <a class="cl" data-li="contacts.${i}" data-lk="contacts.${i}.link" ${c.link ? `href="${esc(c.link)}" target="_blank" rel="noopener"` : ''}>${im(c.icon, `contacts.${i}.icon`)}<span data-k="contacts.${i}.text">${esc(c.text)}</span></a>`).join('')}</div></div><p class="fol" data-k="follow">${esc(cfg.follow)}</p></div></section>`
  };
  const navHref = u => PG.includes(u) ? '#' + u : esc(u);
  function hdr() {
    return `<header class="blue" data-sec="header"${sb('header')}><div class="in hd"><div class="top"><a class="brand" href="#home" data-k="brand">${esc(cfg.brand)}</a>
      <div class="sr"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" autocomplete="off" aria-label="Tìm kiếm sản phẩm">
      <button id="mic" type="button" aria-label="Tìm bằng giọng nói"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div></div>
      <nav>${cfg.nav.map((n, i) => `<a href="${navHref(n.u)}" data-li="nav.${i}" data-lk="nav.${i}.u" data-k="nav.${i}.t">${esc(n.t)}</a>`).join('')}</nav></div></header>`;
  }
  function route() {
    const h = location.hash.slice(1), pg = PG.includes(h) ? h : 'home';
    const hadFocus = document.activeElement && document.activeElement.id === 'q';
    $('app').innerHTML = hdr() + (cfg.pages[pg] || '').split(',').map(s => s.trim()).filter(Boolean).map(s => SEC[s] ? SEC[s]() : '').join('');
    bind(); renderChips(); renderProducts();
    if (hadFocus) { const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } else if (!EDIT) scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);
  document.addEventListener('click', () => { const u = $('sort-l'); if (u) u.hidden = true; });
  window.__cfg = () => cfg;
  window.__set = c => { cfg = c; applyCfg(); route(); };
  window.__redraw = () => { applyCfg(); route(); };
  window.__page = () => { const h = location.hash.slice(1); return PG.includes(h) ? h : 'home'; };

  function bind() {
    const q = $('q'); q.value = query;
    q.oninput = e => { query = e.target.value; if (!$('grid')) { location.hash = '#products'; return; } renderProducts(); };
    q.onkeydown = e => { if (e.key === 'Enter' && $('prod')) $('prod').scrollIntoView(); };
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    $('mic').onclick = () => {
      if (!SR) { alert('Trình duyệt này chưa hỗ trợ tìm kiếm bằng giọng nói (hãy dùng Chrome).'); return; }
      const r = new SR(); r.lang = 'vi-VN';
      r.onresult = ev => { query = ev.results[0][0].transcript; q.value = query; if (!$('grid')) location.hash = '#products'; else { renderProducts(); $('prod').scrollIntoView(); } };
      r.start();
    };
    if ($('sortdd')) {
      const L = { '': 'Mới nhất', asc: 'Giá: thấp → cao', desc: 'Giá: cao → thấp' }, bt = $('sort-b'), ul = $('sort-l');
      const paint = () => { bt.textContent = L[sortBy] + ' ▾'; ul.querySelectorAll('li').forEach(li => li.classList.toggle('on', li.dataset.v === sortBy)); };
      paint();
      bt.onclick = e => { e.stopPropagation(); ul.hidden = !ul.hidden; };
      ul.onclick = e => { const li = e.target.closest('li'); if (!li) return; sortBy = li.dataset.v; ul.hidden = true; paint(); renderProducts(); };
    }
    if ($('chips')) $('chips').onclick = e => {
      const b = e.target.closest('.chip'); if (!b) return;
      const v = b.dataset.c; if (!v) activeCats.clear(); else { const id = Number(v); activeCats.has(id) ? activeCats.delete(id) : activeCats.add(id); }
      renderChips(); renderProducts();
    };
    if ($('grid')) $('grid').onclick = e => { const a = e.target.closest('.p'); if (a) openProduct(Number(a.dataset.id)); };
  }

  /* ---------- Bộ lọc danh mục + sắp xếp giá ---------- */
  function descendantIds(id) {
    const set = new Set([id]); let grew = true;
    while (grew) { grew = false; categories.forEach(c => { if (c.parent_id && set.has(c.parent_id) && !set.has(c.id)) { set.add(c.id); grew = true; } }); }
    return set;
  }
  function rootOf(id) {
    let c = categories.find(x => x.id === id);
    while (c && c.parent_id) c = categories.find(x => x.id === c.parent_id);
    return c ? c.id : null;
  }
  function renderChips() {
    const el = $('chips'); if (!el) return;
    const roots = categories.filter(c => !c.parent_id);
    if (!roots.length) { el.innerHTML = ''; return; }
    const rids = new Set([...activeCats].map(rootOf).filter(Boolean)), kids = categories.filter(c => rids.has(c.parent_id));
    const b = (id, t, on) => `<button type="button" class="chip ${on ? 'on' : ''}" data-c="${id ?? ''}">${esc(t)}</button>`;
    el.innerHTML = b(null, 'Tất cả', !activeCats.size) + roots.map(c => b(c.id, c.name, activeCats.has(c.id))).join('') + (kids.length ? '<span class="brk"></span>' + kids.map(c => b(c.id, '↳ ' + c.name, activeCats.has(c.id))).join('') : '');
  }
  function renderProducts() {
    const g = $('grid'); if (!g) return;
    const ids = activeCats.size ? new Set([...activeCats].flatMap(id => [...descendantIds(id)])) : null, q = norm(query.trim());
    let list = products.filter(p => (!ids || ids.has(p.category_id)) && (!q || norm(p.name).includes(q)));
    if (sortBy) list = [...list].sort((a, b) => sortBy === 'asc' ? Number(a.price) - Number(b.price) : Number(b.price) - Number(a.price));
    shown = list.map(p => p.id);
    if (!list.length) { g.innerHTML = '<div class="empty">' + esc(loadErr || (products.length ? 'Không tìm thấy sản phẩm phù hợp.' : 'Chưa có sản phẩm nào.')) + '</div>'; return; }
    g.innerHTML = list.map(p => `
      <article class="p" data-id="${p.id}">
        <div class="pi"><img loading="lazy" src="${esc(mainImg(p))}" alt="${esc(p.name)}"></div>
        <b class="pn" data-g="prodName">${esc(p.name)}</b>
        <i class="pp" data-g="prodPrice">${money(p.price)}${p.old_price && Number(p.old_price) > Number(p.price) ? `<s>${money(p.old_price)}</s>` : ''}</i>
        ${p.description ? `<p class="pd" data-g="prodDesc">${esc(p.description)}</p>` : ''}
      </article>`).join('');
  }

  /* ---------- Modal sản phẩm (lướt trái/phải + Mua ngay qua Zalo) ---------- */
  let cur = null, curSize = null, curQty = 1;
  function openProduct(id) {
    cur = products.find(p => p.id === id); if (!cur) return;
    curSize = null; curQty = 1;
    const imgs = allImgs(cur), sizes = cur.sizes || [], i = shown.indexOf(id);
    $('modal').innerHTML = `
      <button class="x" id="m-x" aria-label="Đóng">✕</button>
      <div>
        <img class="m-main" id="m-main" src="${esc(imgs[0] || '')}" alt="" draggable="false">
        ${imgs.length > 1 ? `<div class="m-thumbs">${imgs.map((u, k) => `<img src="${esc(u)}" data-i="${k}" class="${k === 0 ? 'on' : ''}" alt="">`).join('')}</div>` : ''}
      </div>
      <div class="m-info">
        ${i > -1 && shown.length > 1 ? `<div class="m-cnt">${i + 1} / ${shown.length} · lướt trái/phải để xem sản phẩm khác</div>` : ''}
        <h2>${esc(cur.name)}</h2>
        <div class="m-price"><span class="p-price">${money(cur.price)}</span>${cur.old_price && Number(cur.old_price) > Number(cur.price) ? `<span class="p-old">${money(cur.old_price)}</span>` : ''}</div>
        ${cur.description ? `<p class="m-desc">${esc(cur.description)}</p>` : ''}
        ${sizes.length ? `<div class="m-label">Chọn size</div><div class="sizes">${sizes.map(s => `<button class="size" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
        <div class="m-label">Số lượng</div>
        <div class="qty"><button id="q-" aria-label="Giảm">−</button><b id="q-n">1</b><button id="q+" aria-label="Tăng">+</button></div>
        <div class="warn" id="m-warn"></div>
        <button class="btn" id="m-add">THÊM VÀO GIỎ HÀNG</button>
        <button class="btn buy" id="m-buy">MUA NGAY (CHAT ZALO)</button>
      </div>`;
    $('modal').scrollTop = 0;
    $('back').classList.add('on'); $('modal').classList.add('on'); document.body.style.overflow = 'hidden';
  }
  function go(d) {
    if (!cur) return;
    const n = shown.indexOf(cur.id) + d;
    if (n >= 0 && n < shown.length) openProduct(shown[n]);
  }
  $('nvl').onclick = () => go(-1); $('nvr').onclick = () => go(1);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAll();
    if ($('modal').classList.contains('on') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); }
  });
  let sx = 0, sy = 0, sw = false;
  $('modal').addEventListener('pointerdown', e => { if (e.target.closest('button,input')) return; sx = e.clientX; sy = e.clientY; sw = true; });
  $('modal').addEventListener('pointerup', e => {
    if (!sw) return; sw = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
  });
  function closeAll() {
    $('modal').classList.remove('on'); $('cart').classList.remove('on'); $('back').classList.remove('on'); document.body.style.overflow = '';
  }
  $('back').addEventListener('click', closeAll);
  $('modal').addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'm-x') return closeAll();
    if (t.matches('.m-thumbs img')) {
      $('m-main').src = t.src;
      document.querySelectorAll('.m-thumbs img').forEach(i => i.classList.toggle('on', i === t));
    }
    if (t.matches('.size')) {
      curSize = t.dataset.s;
      document.querySelectorAll('.size').forEach(i => i.classList.toggle('on', i === t));
      $('m-warn').textContent = '';
    }
    if (t.id === 'q-') { curQty = Math.max(1, curQty - 1); $('q-n').textContent = curQty; }
    if (t.id === 'q+') { curQty = Math.min(99, curQty + 1); $('q-n').textContent = curQty; }
    if (t.id === 'm-add') {
      if ((cur.sizes || []).length && !curSize) { $('m-warn').textContent = 'Vui lòng chọn size trước khi thêm vào giỏ.'; return; }
      const key = cur.id + '|' + (curSize || '');
      const ex = cart.find(i => i.key === key);
      if (ex) ex.qty += curQty;
      else cart.push({ key, id: cur.id, name: cur.name, price: Number(cur.price), image: mainImg(cur), selectedSize: curSize, qty: curQty });
      saveCart(); closeAll(); openCart();
    }
    if (t.id === 'm-buy') {   // Mua ngay -> chuyển sang Zalo, tự sao chép thông tin sản phẩm để dán vào chat
      if ((cur.sizes || []).length && !curSize) { $('m-warn').textContent = 'Vui lòng chọn size trước khi mua.'; return; }
      const msg = `Mình muốn mua: ${cur.name}\n${curSize ? 'Size: ' + curSize + '\n' : ''}Số lượng: ${curQty}\nGiá: ${money(cur.price)}`;
      try { navigator.clipboard.writeText(msg); } catch (err) {}
      $('m-warn').style.color = '#0068ff'; $('m-warn').textContent = 'Đã sao chép thông tin sản phẩm — dán vào khung chat Zalo nhé!';
      window.open(cfg.zalo.link, '_blank');
    }
  });

  /* ---------- Giỏ hàng ---------- */
  const saveCart = () => { try { localStorage.setItem('cart_v1', JSON.stringify(cart)); } catch (e) {} renderCart(); };
  const cartTotal = () => cart.reduce((s, i) => s + i.price * i.qty, 0);
  function renderCart() {
    $('fab-n').textContent = cart.reduce((s, i) => s + i.qty, 0);
    $('ci-total').textContent = money(cartTotal());
    $('ci-list').innerHTML = cart.length ? cart.map(i => `
      <div class="ci">
        <img src="${esc(i.image)}" alt="">
        <div style="flex:1">
          <div class="ci-n">${esc(i.name)}</div>
          <div class="ci-s">${i.selectedSize ? 'Size ' + esc(i.selectedSize) + ' · ' : ''}${money(i.price)}</div>
          <div class="ci-r">
            <div><button data-k="${esc(i.key)}" data-a="-">−</button><span>${i.qty}</span><button data-k="${esc(i.key)}" data-a="+">+</button></div>
            <button class="ci-del" data-k="${esc(i.key)}" data-a="x">Xóa</button>
          </div>
        </div>
      </div>`).join('') : '<p style="color:#666;text-align:center;padding:40px 0">Giỏ hàng đang trống.</p>';
  }
  $('ci-list').addEventListener('click', e => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const it = cart.find(i => i.key === b.dataset.k); if (!it) return;
    if (b.dataset.a === '+') it.qty++;
    if (b.dataset.a === '-') it.qty = Math.max(1, it.qty - 1);
    if (b.dataset.a === 'x') cart = cart.filter(i => i !== it);
    saveCart();
  });
  function openCart() { $('order-msg').textContent = ''; $('back').classList.add('on'); $('cart').classList.add('on'); document.body.style.overflow = 'hidden'; }
  $('fab').addEventListener('click', openCart);

  /* ===== Báo đơn về Telegram (giữ nguyên) ===== */
  async function sendTelegramNotification(orderInfo) {
    if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;

    const formattedCode = `1607${orderInfo.orderId}`;
    let itemsText = orderInfo.items.map(i => `• ${i.name} ${i.selectedSize ? `(Size: ${i.selectedSize})` : ''} - SL: ${i.qty}`).join('\n');

    let message = `🛒 *CÓ ĐƠN HÀNG MỚI!* (#${formattedCode})\n\n` +
                  `👤 *Khách hàng:* ${orderInfo.name}\n` +
                  `📞 *SĐT:* ${orderInfo.phone}\n` +
                  `📍 *Địa chỉ:* ${orderInfo.address}\n` +
                  `📝 *Ghi chú:* ${orderInfo.note || 'Không có'}\n\n` +
                  `📦 *Sản phẩm:*\n${itemsText}\n\n` +
                  `💰 *Tổng tiền:* ${Number(orderInfo.total).toLocaleString('vi-VN')} đ`;

    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'Markdown'
        })
      });
    } catch (err) {
      console.error("Lỗi gửi Telegram:", err);
    }
  }

  /* ===== Đặt hàng: lưu D1 -> báo Telegram -> hiện lời cảm ơn (giữ nguyên) ===== */
  $('checkout').addEventListener('submit', submitOrder);
  async function submitOrder(e) {
    e.preventDefault();
    if (cart.length === 0) return alert('Giỏ hàng trống!');

    const btn = document.getElementById('f-btn');
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ĐANG XỬ LÝ...`;

    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const address = document.getElementById('f-addr').value.trim();
    const note = document.getElementById('f-note').value.trim();
    const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    const cartSnapshot = [...cart];

    let data = null, error = null;
    try {
      const r = await fetch('/api/order', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ customer_name: name, customer_phone: phone, address, note, total_amount: total, cart_items: cartSnapshot }) });
      const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Lỗi máy chủ');
      data = [{ id: j.id }];
    } catch (e) { error = e; }

    if (!error) {
      const rawId = data && data[0] ? data[0].id : 'NEW';
      const formattedOrderId = `1607${rawId}`;

      await sendTelegramNotification({
        orderId: rawId,
        name: name,
        phone: phone,
        address: address,
        note: note,
        items: cartSnapshot,
        total: total
      });

      closeAll();
      document.getElementById('checkout').reset();
      cart = [];
      saveCart();

      showThankYouModal({
        name: name,
        phone: phone,
        orderId: formattedOrderId,
        total: total
      });
    } else {
      alert("Lỗi đặt hàng: " + error.message);
    }
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> XÁC NHẬN ĐẶT HÀNG`;
  }

  function showThankYouModal(info) {
    let modal = document.getElementById('thankYouModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'thankYouModal';
      document.body.appendChild(modal);
    }

    modal.innerHTML = `
      <div>
        <div class="ty-ico">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2>ĐẶT HÀNG THÀNH CÔNG!</h2>
        <p class="ty-code">Mã đơn hàng của bạn: <b>#${info.orderId}</b></p>

        <div class="ty-box">
          <p><b>Khách hàng:</b> ${info.name}</p>
          <p><b>Số điện thoại:</b> ${info.phone}</p>
          <p><b>Tổng thanh toán:</b> <span class="ty-red">${Number(info.total).toLocaleString('vi-VN')} ₫</span></p>

// Gắn watermark chữ lặp chéo lên ảnh (mật độ vừa phải, không có chữ ở góc)
async function addWatermark(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const k = Math.min(1, 1800 / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.drawImage(bmp, 0, 0, w, h);
  const f = Math.round(Math.max(w, h) * 0.04), sx = f * 8.5, sy = f * 5.2, d = Math.hypot(w, h);
  x.translate(w / 2, h / 2); x.rotate(-Math.PI / 6);
  x.font = `bold ${f}px Arial`; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillStyle = 'rgba(255,255,255,.34)'; x.shadowColor = 'rgba(0,0,0,.35)'; x.shadowBlur = f / 6;
  let row = 0;
  for (let yy = -d / 2; yy < d / 2; yy += sy, row++)
    for (let xx = -d / 2 + (row % 2) * sx / 2; xx < d / 2; xx += sx) x.fillText(WATERMARK, xx, yy);
  const png = file.type === 'image/png';
  return new Promise(r => c.toBlob(r, png ? 'image/png' : 'image/jpeg', 0.9));
}

// Tải ảnh lên Cloudinary (wm = true thì gắn watermark trước khi tải)
async function uploadImage(file, wm = true) {
  const blob = (wm && file.type !== 'image/svg+xml') ? await addWatermark(file) : file;
  const fd = new FormData();
  fd.append('file', blob); fd.append('upload_preset', UPLOAD_PRESET); fd.append('folder', '247sneaker');
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method: 'POST', body: fd });
  const j = await r.json();
  if (!r.ok) throw new Error((j.error && j.error.message) || 'Lỗi tải ảnh lên Cloudinary');
  return j.secure_url;
}

// Ảnh có nằm trên Cloudinary của shop không
const isCloud = u => typeof u === 'string' && u.includes(`res.cloudinary.com/${CLOUD_NAME}/`);
const pubId = u => (u.split('/upload/')[1] || '').replace(/^v\d+\//, '').replace(/\.[a-z0-9]+$/i, '');

// Xóa vĩnh viễn ảnh trên Cloudinary (gọi qua /api/delete-image, giữ API secret ở phía máy chủ Cloudflare)
async function deleteImage(u) {
  if (!isCloud(u)) return true;
  let key = localStorage.getItem('adminKey');
  if (!key) { key = prompt('Nhập MÃ QUẢN TRỊ (biến ADMIN_KEY đã cài trên Cloudflare) để xóa ảnh cũ trên Cloudinary:'); if (!key) return false; localStorage.setItem('adminKey', key); }
  try {
    const r = await fetch('/api/delete-image', { method: 'POST', headers: { 'content-type': 'application/json', 'x-admin-key': key }, body: JSON.stringify({ public_id: pubId(u) }) });
    if (r.status === 401) localStorage.removeItem('adminKey');
    return r.ok;
  } catch (e) { return false; }
}
