<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>247 Sneaker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root { --lime:#d2fb83; --ink:#000; --line:#5e5e5e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { scroll-behavior:smooth; }
  body { font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; background:#fff; color:#000; -webkit-font-smoothing:antialiased; }
  button { font-family:inherit; cursor:pointer; }
  img { display:block; }

  /* ===== Khung thiết kế 1024px, co giãn theo --u ===== */
  .stage { max-width:1024px; margin:0 auto; container-type:inline-size; }
  .canvas { --u:calc(100cqw / 1024); position:relative; width:100%; }

  /* ===== HERO (nền xanh chuối) ===== */
  .hero { background:var(--lime); }
  .hero .canvas { height:calc(576.14 * var(--u)); }
  .hi { position:absolute; object-fit:cover; }
  .ov { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  #q { position:absolute; left:calc(342 * var(--u)); top:calc(30 * var(--u)); width:calc(330 * var(--u)); height:calc(34 * var(--u));
       border:0; background:transparent; outline:none; font:inherit; font-size:max(13px, calc(15 * var(--u))); color:#000; }
  #mic { position:absolute; left:calc(676 * var(--u)); top:calc(30 * var(--u)); width:calc(32 * var(--u)); height:calc(34 * var(--u));
         border:0; background:transparent; }

  /* ===== 3 ảnh bo góc ===== */
  .cards .canvas { height:calc(492.9 * var(--u)); }
  .card3 { position:absolute; top:calc(82.84 * var(--u)); width:calc(307.54 * var(--u)); height:calc(410.05 * var(--u));
           object-fit:cover; border-radius:calc(37.5 * var(--u)); }

  /* ===== SẢN PHẨM (phần trống trong thiết kế) ===== */
  .shop { padding:calc(40 * 100cqw / 1024) 0 90px; }
  .shop-in { padding:0 2.17%; }
  .shop-head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .shop-title { font-weight:800; font-size:clamp(28px,4.2vw,44px); letter-spacing:-.03em; line-height:1; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1.4px solid var(--line); background:#fff; color:#000; border-radius:999px; padding:8px 16px; font-size:14px; font-weight:600; transition:.15s; }
  .chip:hover { background:var(--lime); }
  .chip.on { background:var(--lime); border-color:#000; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:34px 2.78%; }
  .p { cursor:pointer; }
  .p-img { width:100%; aspect-ratio:307.54/410.05; object-fit:cover; border-radius:clamp(22px,3.66vw,37.5px); background:#f1f1ec; transition:transform .25s; }
  .p:hover .p-img { transform:translateY(-4px); }
  .p-name { font-weight:700; font-size:17px; margin-top:14px; line-height:1.3; }
  .p-row { display:flex; align-items:center; gap:10px; margin-top:8px; flex-wrap:wrap; }
  .p-price { background:var(--lime); border-radius:999px; padding:5px 12px; font-weight:800; font-size:15px; }
  .p-old { color:#888; text-decoration:line-through; font-size:14px; }
  .p-cat { color:#666; font-size:13px; margin-top:6px; }
  .empty { grid-column:1/-1; text-align:center; color:#666; padding:60px 0; font-size:16px; }

  /* ===== Modal sản phẩm ===== */
  .back { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; z-index:50; }
  .back.on { display:block; }
  .modal { position:fixed; z-index:60; left:50%; top:50%; transform:translate(-50%,-50%); width:min(940px,94vw); max-height:92vh; overflow:auto;
           background:#fff; border-radius:28px; display:none; padding:24px; }
  .modal.on { display:grid; grid-template-columns:1.1fr 1fr; gap:28px; }
  .m-main { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:24px; background:#f1f1ec; }
  .m-thumbs { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .m-thumbs img { width:58px; height:58px; object-fit:cover; border-radius:12px; border:2px solid transparent; cursor:pointer; }
  .m-thumbs img.on { border-color:#000; }
  .m-info h2 { font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.15; }
  .m-price { margin-top:12px; display:flex; gap:10px; align-items:center; }
  .m-desc { margin-top:16px; color:#444; line-height:1.55; font-size:15px; white-space:pre-line; }
  .m-label { margin-top:20px; font-weight:700; font-size:14px; }
  .sizes { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .size { border:1.4px solid var(--line); background:#fff; border-radius:999px; min-width:48px; padding:8px 12px; font-weight:600; font-size:14px; }
  .size.on { background:var(--lime); border-color:#000; }
  .qty { display:inline-flex; align-items:center; gap:14px; margin-top:8px; border:1.4px solid var(--line); border-radius:999px; padding:4px 8px; }
  .qty button { border:0; background:transparent; font-size:20px; width:30px; height:30px; border-radius:50%; }
  .qty button:hover { background:var(--lime); }
  .btn { display:block; width:100%; border:0; border-radius:999px; background:#000; color:#fff; padding:15px 20px; font-size:16px; font-weight:800; margin-top:22px; transition:.15s; }
  .btn:hover { background:var(--lime); color:#000; }
  .btn:disabled { opacity:.5; cursor:default; }
  .x { position:absolute; right:14px; top:12px; width:38px; height:38px; border-radius:50%; border:0; background:#f1f1ec; font-size:20px; z-index:2; }
  .x:hover { background:var(--lime); }
  .warn { color:#c0392b; font-size:13px; margin-top:8px; min-height:16px; }

  /* ===== Giỏ hàng ===== */
  .fab { position:fixed; right:18px; bottom:18px; z-index:40; background:#000; color:#fff; border:0; border-radius:999px; padding:14px 22px; font-weight:800; font-size:15px; box-shadow:0 6px 24px rgba(0,0,0,.25); }
  .fab:hover { background:var(--lime); color:#000; }
  .fab b { background:var(--lime); color:#000; border-radius:999px; padding:1px 8px; margin-left:6px; }
  .drawer { position:fixed; z-index:60; top:0; right:0; height:100%; width:min(430px,100vw); background:#fff; transform:translateX(105%); transition:transform .28s; display:flex; flex-direction:column; padding:22px; }
  .drawer.on { transform:none; }
  .drawer h3 { font-size:24px; font-weight:800; letter-spacing:-.02em; }
  .ci-list { flex:1; overflow:auto; margin:14px 0; }
  .ci { display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #eee; }
  .ci img { width:64px; height:80px; object-fit:cover; border-radius:14px; }
  .ci-n { font-weight:700; font-size:14px; }
  .ci-s { color:#666; font-size:13px; margin-top:2px; }
  .ci-r { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
  .ci-r button { border:0; background:#f1f1ec; width:26px; height:26px; border-radius:50%; font-size:15px; }
  .ci-r span { margin:0 8px; font-weight:700; }
  .ci-del { background:transparent !important; color:#c0392b; width:auto !important; font-size:12px !important; }
  .total { display:flex; justify-content:space-between; font-size:18px; font-weight:800; padding:10px 0; }
  .drawer input, .drawer textarea { width:100%; border:1.4px solid var(--line); border-radius:14px; padding:11px 14px; font:inherit; font-size:14px; margin-top:8px; outline:none; }
  .drawer input:focus, .drawer textarea:focus { border-color:#000; background:#fbfff2; }
  #order-msg { margin-top:10px; font-weight:700; text-align:center; font-size:14px; }

  @media (max-width:700px) {
    .grid { grid-template-columns:repeat(2,1fr); gap:24px 3.5%; }
    .p-name { font-size:15px; } .p-price { font-size:13px; }
    .modal.on { grid-template-columns:1fr; padding:16px; }
    .shop-in { padding:0 12px; }
  }

  /* ===== Lời cảm ơn sau khi đặt đơn (giữ y như index cũ) ===== */
  #thankYouModal { position:fixed; inset:0; background:rgba(0,0,0,.7); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); z-index:80; display:flex; align-items:center; justify-content:center; padding:1rem; line-height:1.5; }
  #thankYouModal > div { background:#fff; width:100%; max-width:32rem; border-radius:1rem; box-shadow:0 25px 50px -12px rgba(0,0,0,.25); padding:1.5rem; text-align:center; position:relative; max-height:100%; overflow:auto; }
  @media (min-width:768px){ #thankYouModal > div { padding:2rem; } }
  #thankYouModal .ty-ico { width:4rem; height:4rem; background:#fef3c7; color:#d97706; border-radius:9999px; display:flex; align-items:center; justify-content:center; font-size:1.875rem; margin:0 auto 1rem; }
  #thankYouModal h2 { font-size:1.5rem; line-height:2rem; font-weight:900; color:#0f172a; margin-bottom:.5rem; }
  #thankYouModal .ty-code { font-size:.75rem; line-height:1rem; color:#6b7280; margin-bottom:1.5rem; }
  #thankYouModal .ty-code b { color:#d97706; }
  #thankYouModal .ty-box { background:#f9fafb; padding:1rem; border-radius:.75rem; border:1px solid #e5e7eb; text-align:left; font-size:.75rem; line-height:1rem; margin-bottom:1.5rem; }
  #thankYouModal .ty-box > p + p, #thankYouModal .ty-box > p + hr, #thankYouModal .ty-box > hr + p { margin-top:.5rem; }
  #thankYouModal .ty-box hr { border:0; border-top:1px solid #e5e7eb; margin:.5rem 0; }
  #thankYouModal .ty-red { color:#dc2626; font-weight:700; }
  #thankYouModal .ty-quote { color:#4b5563; font-style:italic; line-height:1.625; }
  #thankYouModal .ty-quote b { color:#111827; }
  #thankYouModal .ty-btn { width:100%; background:#0f172a; color:#fff; font-weight:900; padding:.75rem 1rem; border:0; border-radius:.75rem; font-size:.75rem; line-height:1rem; text-transform:uppercase; letter-spacing:.05em; box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1); transition:.15s; }
  #thankYouModal .ty-btn:hover { background:#f59e0b; color:#020617; }
</style>

<script>
  const SUPABASE_URL = 'https://uleckabliwereivgxryo.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsZWNrYWJsaXdlcmVpdmd4cnlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzI1NTUsImV4cCI6MjEwNjMwODU1NX0.Sa5fY_OceWa7TI9yqBSMLM24ZTEN6g10j4RrXvENs3o';

  const TELEGRAM_BOT_TOKEN = "8715013237:AAHnalBgr7rnIeJewh3GMr_tfFnv8ewJipY";
  const TELEGRAM_CHAT_ID = "8866272456";

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => Number(n || 0).toLocaleString('vi-VN') + ' đ';
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();

  let db = null;
  try { db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { console.error(e); }

  let products = [], categories = [], activeCat = null, query = '';
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('cart_v1') || '[]'); } catch (e) {}

  const mainImg = p => p.main_image || p.image_url || (p.images && p.images[0]) || '';
  const allImgs = p => (p.images && p.images.length ? p.images : [mainImg(p)]).filter(Boolean);

  /* ---------- Tải dữ liệu ---------- */
  async function load() {
    if (!db) { $('grid').innerHTML = '<div class="empty">Không kết nối được Supabase.</div>'; return; }
    const [c, p] = await Promise.all([
      db.from('categories').select('*').order('id', { ascending: true }),
      db.from('products').select('*').order('id', { ascending: false })
    ]);
    categories = c.data || [];
    products = p.data || [];
    if (p.error) { $('grid').innerHTML = '<div class="empty">Lỗi tải sản phẩm: ' + esc(p.error.message) + '</div>'; return; }
    renderChips(); renderProducts();
  }

  function descendantIds(id) {
    const set = new Set([id]); let grew = true;
    while (grew) { grew = false; categories.forEach(c => { if (c.parent_id && set.has(c.parent_id) && !set.has(c.id)) { set.add(c.id); grew = true; } }); }
    return set;
  }

  function renderChips() {
    const roots = categories.filter(c => !c.parent_id);
    if (!roots.length) { $('chips').innerHTML = ''; return; }
    $('chips').innerHTML = `<button class="chip ${activeCat === null ? 'on' : ''}" data-c="">Tất cả</button>` +
      roots.map(c => `<button class="chip ${activeCat === c.id ? 'on' : ''}" data-c="${c.id}">${esc(c.name)}</button>`).join('');
  }
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    activeCat = b.dataset.c ? Number(b.dataset.c) : null;
    renderChips(); renderProducts();
  });

  function renderProducts() {
    const ids = activeCat ? descendantIds(activeCat) : null;
    const q = norm(query.trim());
    const list = products.filter(p => (!ids || ids.has(p.category_id)) && (!q || norm(p.name).includes(q)));
    if (!list.length) { $('grid').innerHTML = '<div class="empty">' + (products.length ? 'Không tìm thấy sản phẩm phù hợp.' : 'Chưa có sản phẩm nào.') + '</div>'; return; }
    const catName = {}; categories.forEach(c => catName[c.id] = c.name);
    $('grid').innerHTML = list.map(p => `
      <article class="p" data-id="${p.id}">
        <img class="p-img" loading="lazy" src="${esc(mainImg(p))}" alt="${esc(p.name)}">
        <div class="p-name">${esc(p.name)}</div>
        <div class="p-row">
          <span class="p-price">${money(p.price)}</span>
          ${p.old_price && Number(p.old_price) > Number(p.price) ? `<span class="p-old">${money(p.old_price)}</span>` : ''}
        </div>
        ${catName[p.category_id] ? `<div class="p-cat">${esc(catName[p.category_id])}</div>` : ''}
      </article>`).join('');
  }
  $('grid').addEventListener('click', e => {
    const a = e.target.closest('.p'); if (a) openProduct(Number(a.dataset.id));
  });

  /* ---------- Tìm kiếm ---------- */
  $('q').addEventListener('input', e => { query = e.target.value; renderProducts(); });
  $('q').addEventListener('keydown', e => { if (e.key === 'Enter') $('shop').scrollIntoView(); });
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  $('mic').addEventListener('click', () => {
    if (!SR) { alert('Trình duyệt này chưa hỗ trợ tìm kiếm bằng giọng nói (hãy dùng Chrome).'); return; }
    const r = new SR(); r.lang = 'vi-VN';
    r.onresult = ev => { query = ev.results[0][0].transcript; $('q').value = query; renderProducts(); $('shop').scrollIntoView(); };
    r.start();
  });

  /* ---------- Modal sản phẩm ---------- */
  let cur = null, curSize = null, curQty = 1;
  function openProduct(id) {
    cur = products.find(p => p.id === id); if (!cur) return;
    curSize = null; curQty = 1;
    const imgs = allImgs(cur), sizes = cur.sizes || [];
    $('modal').innerHTML = `
      <button class="x" id="m-x" aria-label="Đóng">✕</button>
      <div>
        <img class="m-main" id="m-main" src="${esc(imgs[0] || '')}" alt="">
        ${imgs.length > 1 ? `<div class="m-thumbs">${imgs.map((u, i) => `<img src="${esc(u)}" data-i="${i}" class="${i === 0 ? 'on' : ''}" alt="">`).join('')}</div>` : ''}
      </div>
      <div class="m-info">
        <h2>${esc(cur.name)}</h2>
        <div class="m-price"><span class="p-price">${money(cur.price)}</span>${cur.old_price && Number(cur.old_price) > Number(cur.price) ? `<span class="p-old">${money(cur.old_price)}</span>` : ''}</div>
        ${cur.description ? `<p class="m-desc">${esc(cur.description)}</p>` : ''}
        ${sizes.length ? `<div class="m-label">Chọn size</div><div class="sizes">${sizes.map(s => `<button class="size" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
        <div class="m-label">Số lượng</div>
        <div class="qty"><button id="q-" aria-label="Giảm">−</button><b id="q-n">1</b><button id="q+" aria-label="Tăng">+</button></div>
        <div class="warn" id="m-warn"></div>
        <button class="btn" id="m-add">THÊM VÀO GIỎ HÀNG</button>
      </div>`;
    $('back').classList.add('on'); $('modal').classList.add('on'); document.body.style.overflow = 'hidden';
  }
  function closeAll() {
    $('modal').classList.remove('on'); $('cart').classList.remove('on'); $('back').classList.remove('on'); document.body.style.overflow = '';
  }
  $('back').addEventListener('click', closeAll);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAll(); });
  $('modal').addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'm-x') return closeAll();
    if (t.matches('.m-thumbs img')) {
      $('m-main').src = t.src;
      document.querySelectorAll('.m-thumbs img').forEach(i => i.classList.toggle('on', i === t));
    }
    if (t.matches('.size')) {
      curSize = t.dataset.s;
      document.querySelectorAll('.size').forEach(i => i.classList.toggle('on', i === t));
      $('m-warn').textContent = '';
    }
    if (t.id === 'q-') { curQty = Math.max(1, curQty - 1); $('q-n').textContent = curQty; }
    if (t.id === 'q+') { curQty = Math.min(99, curQty + 1); $('q-n').textContent = curQty; }
    if (t.id === 'm-add') {
      if ((cur.sizes || []).length && !curSize) { $('m-warn').textContent = 'Vui lòng chọn size trước khi thêm vào giỏ.'; return; }
      const key = cur.id + '|' + (curSize || '');
      const ex = cart.find(i => i.key === key);
      if (ex) ex.qty += curQty;
      else cart.push({ key, id: cur.id, name: cur.name, price: Number(cur.price), image: mainImg(cur), selectedSize: curSize, qty: curQty });
      saveCart(); closeAll(); openCart();
    }
  });

  /* ---------- Giỏ hàng ---------- */
  const saveCart = () => { try { localStorage.setItem('cart_v1', JSON.stringify(cart)); } catch (e) {} renderCart(); };
  const cartTotal = () => cart.reduce((s, i) => s + i.price * i.qty, 0);
  function renderCart() {
    $('fab-n').textContent = cart.reduce((s, i) => s + i.qty, 0);
    $('ci-total').textContent = money(cartTotal());
    $('ci-list').innerHTML = cart.length ? cart.map(i => `
      <div class="ci">
        <img src="${esc(i.image)}" alt="">
        <div style="flex:1">
          <div class="ci-n">${esc(i.name)}</div>
          <div class="ci-s">${i.selectedSize ? 'Size ' + esc(i.selectedSize) + ' · ' : ''}${money(i.price)}</div>
          <div class="ci-r">
            <div><button data-k="${esc(i.key)}" data-a="-">−</button><span>${i.qty}</span><button data-k="${esc(i.key)}" data-a="+">+</button></div>
            <button class="ci-del" data-k="${esc(i.key)}" data-a="x">Xóa</button>
          </div>
        </div>
      </div>`).join('') : '<p style="color:#666;text-align:center;padding:40px 0">Giỏ hàng đang trống.</p>';
  }
  $('ci-list').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const it = cart.find(i => i.key === b.dataset.k); if (!it) return;
    if (b.dataset.a === '+') it.qty++;
    if (b.dataset.a === '-') it.qty = Math.max(1, it.qty - 1);
    if (b.dataset.a === 'x') cart = cart.filter(i => i !== it);
    saveCart();
  });
  function openCart() { $('order-msg').textContent = ''; $('back').classList.add('on'); $('cart').classList.add('on'); document.body.style.overflow = 'hidden'; }
  $('fab').addEventListener('click', openCart);

  /* ===== Báo đơn về Telegram (giữ nguyên từ index cũ) ===== */
  async function sendTelegramNotification(orderInfo) {
    if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;

    const formattedCode = `1607${orderInfo.orderId}`;
    let itemsText = orderInfo.items.map(i => `• ${i.name} ${i.selectedSize ? `(Size: ${i.selectedSize})` : ''} - SL: ${i.qty}`).join('\n');

    let message = `🛒 *CÓ ĐƠN HÀNG MỚI!* (#${formattedCode})\n\n` +
                  `👤 *Khách hàng:* ${orderInfo.name}\n` +
                  `📞 *SĐT:* ${orderInfo.phone}\n` +
                  `📍 *Địa chỉ:* ${orderInfo.address}\n` +
                  `📝 *Ghi chú:* ${orderInfo.note || 'Không có'}\n\n` +
                  `📦 *Sản phẩm:*\n${itemsText}\n\n` +
                  `💰 *Tổng tiền:* ${Number(orderInfo.total).toLocaleString('vi-VN')} đ`;

    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'Markdown'
        })
      });
    } catch (err) {
      console.error("Lỗi gửi Telegram:", err);
    }
  }

  /* ===== Đặt hàng: lưu Supabase -> báo Telegram -> hiện lời cảm ơn (giữ nguyên từ index cũ) ===== */
  $('checkout').addEventListener('submit', submitOrder);
  async function submitOrder(e) {
    e.preventDefault();
    if (cart.length === 0) return alert('Giỏ hàng trống!');

    const btn = document.getElementById('f-btn');
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ĐANG XỬ LÝ...`;

    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const address = document.getElementById('f-addr').value.trim();
    const note = document.getElementById('f-note').value.trim();
    const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    const cartSnapshot = [...cart];

    const { data, error } = await db.from('orders').insert([{
      customer_name: name,
      customer_phone: phone,
      address: address,
      note: note,
      total_amount: total,
      cart_items: cartSnapshot
    }]).select();

    if (!error) {
      const rawId = data && data[0] ? data[0].id : 'NEW';
      const formattedOrderId = `1607${rawId}`;

      await sendTelegramNotification({
        orderId: rawId,
        name: name,
        phone: phone,
        address: address,
        note: note,
        items: cartSnapshot,
        total: total
      });

      closeAll();
      document.getElementById('checkout').reset();
      cart = [];
      saveCart();

      showThankYouModal({
        name: name,
        phone: phone,
        orderId: formattedOrderId,
        total: total
      });
    } else {
      alert("Lỗi đặt hàng: " + error.message);
    }
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> XÁC NHẬN ĐẶT HÀNG`;
  }

  function showThankYouModal(info) {
    let modal = document.getElementById('thankYouModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'thankYouModal';
      document.body.appendChild(modal);
    }

    modal.innerHTML = `
      <div>
        <div class="ty-ico">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2>ĐẶT HÀNG THÀNH CÔNG!</h2>
        <p class="ty-code">Mã đơn hàng của bạn: <b>#${info.orderId}</b></p>

        <div class="ty-box">
          <p><b>Khách hàng:</b> ${info.name}</p>
          <p><b>Số điện thoại:</b> ${info.phone}</p>
          <p><b>Tổng thanh toán:</b> <span class="ty-red">${Number(info.total).toLocaleString('vi-VN')} ₫</span></p>
          <hr>
          <p class="ty-quote">
            "Cảm ơn Quý khách <b>${info.name}</b> đã tin tưởng. Nhân viên CSKH sẽ kết bạn và nhắn tin qua Zalo <b>${info.phone}</b> để kiểm tra lại thông tin giao hàng và tư vấn chi tiết cho anh/chị nhé. Chúc anh/chị một ngày tốt lành!"
          </p>
        </div>

        <button class="ty-btn" onclick="document.getElementById('thankYouModal').remove()">
          HOÀN TẤT & TIẾP TỤC MUA SẮM
        </button>
      </div>
    `;
  }

  renderCart();
  load();
</script>
</body>
</html>
