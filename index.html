<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>247 Sneaker</title>
<link id="fav" rel="icon" href="img/logo.jpg">
<link id="gf" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="site-config.js"></script>
<style>
:root{--bg:#8AA9E2;--card:#D9D5D1;--ink:#111;--fh:'Lexend Giga';--fb:'Lexend';--fn:'Arima'}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--fb),Arial,sans-serif;background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}button{cursor:pointer}img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
.blue{background:var(--bg);color:#fff}
.in{max-width:1024px;margin:0 auto;padding:0 3.5%}
.hd{padding-top:22px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font:800 clamp(20px,3.4vw,31px) Arial,sans-serif;letter-spacing:-.01em}
.sr{display:flex;align-items:center;gap:8px;border:2px solid #fff;border-radius:99px;padding:3px 12px;width:min(310px,48vw);height:36px}
.sr svg{width:17px;height:17px;flex:none;stroke:#fff;fill:none;stroke-width:2}
.sr input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:#fff;font-size:14px}
.sr button{border:0;background:none;display:flex;padding:0}
nav{background:#fff;border-radius:12px;margin:12px 0 14px;display:flex;justify-content:space-between;gap:6px;padding:5px 2.5%;font:700 clamp(11px,2.2vw,20px) var(--fn),serif;color:var(--bg)}
nav a{padding:3px 6px;white-space:nowrap}nav a.on{text-decoration:underline}
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8%}.ph img{width:100%;aspect-ratio:1.17;object-fit:cover}
.big{font:900 min(20.6vw,211px)/.8 'Arial Black','Archivo Black',Arial,sans-serif;letter-spacing:-.04em;text-align:center;padding:3.5% 0 5%;margin-top:.5%}
.gal{max-width:1024px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:3%;padding:7.5% 2%}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:clamp(20px,4.2vw,43px)}
.sec{padding:clamp(36px,6vw,64px) 0 clamp(40px,8vw,80px)}
.ttl{font:600 clamp(17px,4.1vw,40px)/1.25 var(--fh),sans-serif;text-transform:lowercase;letter-spacing:.03em;white-space:pre-line;margin-bottom:22px}
.bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-start;margin-bottom:26px}
#chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}.brk{flex-basis:100%;height:0}
.chip{border:1.5px solid #fff;background:transparent;color:#fff;border-radius:99px;padding:7px 15px;font-size:13px;font-weight:600}.chip.on,.chip:hover{background:#fff;color:var(--bg)}
#sort{border:1.5px solid #fff;background:transparent;color:#fff;border-radius:99px;padding:7px 12px;font-size:13px;font-weight:600;outline:0}#sort option{color:#111}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 2.4%}
.p{cursor:pointer}
.pi{aspect-ratio:210/275;background:var(--card);border-radius:clamp(18px,4.2vw,43px);overflow:hidden}.pi img{width:100%;height:100%;object-fit:cover;transition:transform .3s}.p:hover .pi img{transform:scale(1.04)}
.pn{display:block;font:700 clamp(12px,1.5vw,14px) Arial,sans-serif;margin-top:12px}
.pp{display:block;font:italic 700 clamp(12px,1.5vw,14px) Arial,sans-serif;margin-top:2px}.pp s{font-weight:400;opacity:.75;margin-left:6px}
.pd{font:400 clamp(10px,1.2vw,12px)/1.4 Arial,sans-serif;margin-top:7px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{grid-column:1/-1;text-align:center;padding:50px 0}
.sz{padding:clamp(36px,6vw,64px) 0;background:#fff}.sz .ttl{color:var(--bg)}
table{width:100%;border-collapse:collapse;color:var(--bg);text-align:center;font:400 clamp(12px,2.2vw,21px) Arial,sans-serif}
td,th{border:1px solid var(--bg);padding:clamp(8px,1.6vw,16px) 4px;font-weight:400}
.st{display:grid;grid-template-columns:1fr 1fr;gap:5%}.st a{display:block}.st img.mp{width:100%;aspect-ratio:1.33;object-fit:cover}
.sa{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:clamp(13px,2.4vw,21px);line-height:1.35}.sa img{width:clamp(36px,5.8vw,58px);height:auto;flex:none}
.wh{background:#fff}
.ct{display:grid;grid-template-columns:1fr 1fr;gap:6%;align-items:center;padding:clamp(30px,6vw,60px) 0 20px}
.lg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:15%}
.cl{display:flex;align-items:center;gap:6%;color:var(--bg);font-size:clamp(14px,2.7vw,27px);margin:3.5% 0}.cl img{width:clamp(36px,6vw,58px);height:clamp(36px,6vw,58px);object-fit:contain;flex:none}
.fol{color:var(--bg);font-size:clamp(15px,2.9vw,28px);line-height:1.5;padding:0 0 clamp(30px,6vw,60px);max-width:90%}

/* ===== Modal sản phẩm ===== */
.back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:50}.back.on{display:block}
.modal{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(940px,94vw);max-height:92vh;overflow:auto;background:#fff;color:#111;border-radius:28px;display:none;padding:24px;touch-action:pan-y}
.modal.on{display:grid;grid-template-columns:1.1fr 1fr;gap:28px}
.m-main{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:24px;background:#f1f1ec;user-select:none;-webkit-user-drag:none}
.m-thumbs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.m-thumbs img{width:58px;height:58px;object-fit:cover;border-radius:12px;border:2px solid transparent;cursor:pointer}.m-thumbs img.on{border-color:#000}
.m-info h2{font-size:26px;font-weight:800;line-height:1.15}.m-cnt{font-size:12px;color:#888;margin-bottom:6px}
.m-price{margin-top:12px;display:flex;gap:10px;align-items:center}
.p-price{background:var(--bg);color:#fff;border-radius:99px;padding:5px 12px;font-weight:800;font-size:15px}.p-old{color:#888;text-decoration:line-through;font-size:14px}
.m-desc{margin-top:16px;color:#444;line-height:1.55;font-size:15px;white-space:pre-line}.m-label{margin-top:20px;font-weight:700;font-size:14px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.size{border:1.4px solid #999;background:#fff;border-radius:99px;min-width:48px;padding:8px 12px;font-weight:600;font-size:14px}.size.on{background:var(--bg);color:#fff;border-color:var(--bg)}
.qty{display:inline-flex;align-items:center;gap:14px;margin-top:8px;border:1.4px solid #999;border-radius:99px;padding:4px 8px}.qty button{border:0;background:transparent;font-size:20px;width:30px;height:30px;border-radius:50%}.qty button:hover{background:var(--bg);color:#fff}
.btn{display:block;width:100%;border:0;border-radius:99px;background:#000;color:#fff;padding:15px 20px;font-size:16px;font-weight:800;margin-top:22px;transition:.15s}.btn:hover{background:var(--bg)}.btn:disabled{opacity:.5;cursor:default}
.x{position:absolute;right:14px;top:12px;width:38px;height:38px;border-radius:50%;border:0;background:#f1f1ec;font-size:20px;z-index:2}.x:hover{background:var(--bg);color:#fff}
.warn{color:#c0392b;font-size:13px;margin-top:8px;min-height:16px}
.nv{position:fixed;top:50%;z-index:70;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#111;box-shadow:0 2px 12px rgba(0,0,0,.35);font-size:28px;line-height:1;display:none}
.nv.l{left:10px}.nv.r{right:10px}.modal.on~.nv{display:block}.nv:hover{background:var(--bg);color:#fff}

/* ===== Giỏ hàng ===== */
.fab{position:fixed;right:18px;bottom:18px;z-index:40;background:#000;color:#fff;border:0;border-radius:99px;padding:14px 22px;font-weight:800;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.fab:hover{background:#fff;color:var(--bg)}.fab b{background:var(--bg);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px}
.drawer{position:fixed;z-index:60;top:0;right:0;height:100%;width:min(430px,100vw);background:#fff;color:#111;transform:translateX(105%);transition:transform .28s;display:flex;flex-direction:column;padding:22px}.drawer.on{transform:none}
.drawer h3{font-size:24px;font-weight:800}.ci-list{flex:1;overflow:auto;margin:14px 0}
.ci{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.ci img{width:64px;height:80px;object-fit:cover;border-radius:14px}
.ci-n{font-weight:700;font-size:14px}.ci-s{color:#666;font-size:13px;margin-top:2px}
.ci-r{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.ci-r button{border:0;background:#f1f1ec;width:26px;height:26px;border-radius:50%;font-size:15px}.ci-r span{margin:0 8px;font-weight:700}
.ci-del{background:transparent!important;color:#c0392b;width:auto!important;font-size:12px!important}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:10px 0}
.drawer input,.drawer textarea{width:100%;border:1.4px solid #999;border-radius:14px;padding:11px 14px;font:inherit;font-size:14px;margin-top:8px;outline:none}.drawer input:focus,.drawer textarea:focus{border-color:#000}
#order-msg{margin-top:10px;font-weight:700;text-align:center;font-size:14px}

@media(max-width:700px){
  .grid{grid-template-columns:repeat(2,1fr);gap:26px 4%}
  .modal.on{grid-template-columns:1fr;padding:16px}
  .nv{width:36px;height:36px;font-size:22px}
}

/* ===== Lời cảm ơn sau khi đặt đơn (giữ y như cũ) ===== */
#thankYouModal{position:fixed;inset:0;background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:80;display:flex;align-items:center;justify-content:center;padding:1rem;line-height:1.5;color:#111}
#thankYouModal>div{background:#fff;width:100%;max-width:32rem;border-radius:1rem;box-shadow:0 25px 50px -12px rgba(0,0,0,.25);padding:1.5rem;text-align:center;position:relative;max-height:100%;overflow:auto}
@media(min-width:768px){#thankYouModal>div{padding:2rem}}
#thankYouModal .ty-ico{width:4rem;height:4rem;background:#fef3c7;color:#d97706;border-radius:9999px;display:flex;align-items:center;justify-content:center;font-size:1.875rem;margin:0 auto 1rem}
#thankYouModal h2{font-size:1.5rem;line-height:2rem;font-weight:900;color:#0f172a;margin-bottom:.5rem}
#thankYouModal .ty-code{font-size:.75rem;line-height:1rem;color:#6b7280;margin-bottom:1.5rem}#thankYouModal .ty-code b{color:#d97706}
#thankYouModal .ty-box{background:#f9fafb;padding:1rem;border-radius:.75rem;border:1px solid #e5e7eb;text-align:left;font-size:.75rem;line-height:1rem;margin-bottom:1.5rem}
#thankYouModal .ty-box>p+p,#thankYouModal .ty-box>p+hr,#thankYouModal .ty-box>hr+p{margin-top:.5rem}
#thankYouModal .ty-box hr{border:0;border-top:1px solid #e5e7eb;margin:.5rem 0}
#thankYouModal .ty-red{color:#dc2626;font-weight:700}
#thankYouModal .ty-quote{color:#4b5563;font-style:italic;line-height:1.625}#thankYouModal .ty-quote b{color:#111827}
#thankYouModal .ty-btn{width:100%;background:#0f172a;color:#fff;font-weight:900;padding:.75rem 1rem;border:0;border-radius:.75rem;font-size:.75rem;line-height:1rem;text-transform:uppercase;letter-spacing:.05em;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);transition:.15s}
#thankYouModal .ty-btn:hover{background:#f59e0b;color:#020617}
</style>
</head>
<body>

<div id="app"></div>

<div class="back" id="back"></div>
<div class="modal" id="modal"></div>
<button class="nv l" id="nvl" aria-label="Sản phẩm trước">‹</button>
<button class="nv r" id="nvr" aria-label="Sản phẩm sau">›</button>
<button class="fab" id="fab">Giỏ hàng <b id="fab-n">0</b></button>
<aside class="drawer" id="cart">
  <h3>Giỏ hàng</h3>
  <div class="ci-list" id="ci-list"></div>
  <div class="total"><span>Tổng cộng</span><span id="ci-total">0 đ</span></div>
  <form id="checkout" autocomplete="on">
    <input id="f-name" placeholder="Họ và tên *" required>
    <input id="f-phone" placeholder="Số điện thoại *" inputmode="tel" required>
    <input id="f-addr" placeholder="Địa chỉ nhận hàng *" required>
    <textarea id="f-note" rows="2" placeholder="Ghi chú (không bắt buộc)"></textarea>
    <button class="btn" id="f-btn" type="submit"><i class="fa-solid fa-check-circle"></i> XÁC NHẬN ĐẶT HÀNG</button>
  </form>
  <div id="order-msg"></div>
</aside>

<script>
  const TELEGRAM_BOT_TOKEN = "8715013237:AAHnalBgr7rnIeJewh3GMr_tfFnv8ewJipY";
  const TELEGRAM_CHAT_ID = "8866272456";

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => Number(n || 0).toLocaleString('vi-VN') + ' đ';
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();

  let db = null;
  try { db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { console.error(e); }

  let cfg = clone(DEFAULTS), products = [], categories = [], activeCat = null, query = '', sortBy = '', shown = [], loadErr = '';
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('cart_v1') || '[]'); } catch (e) {}

  const mainImg = p => p.main_image || p.image_url || (p.images && p.images[0]) || '';
  const allImgs = p => (p.images && p.images.length ? p.images : [mainImg(p)]).filter(Boolean);

  /* ---------- Tải dữ liệu + áp giao diện ---------- */
  async function load() {
    if (db) {
      const [s, c, p] = await Promise.all([
        db.from('site_settings').select('data').eq('id', 'main').maybeSingle(),
        db.from('categories').select('*').order('id', { ascending: true }),
        db.from('products').select('*').order('id', { ascending: false })
      ]);
      cfg = merge(DEFAULTS, s.data && s.data.data);
      categories = c.data || []; products = p.data || [];
      if (p.error) loadErr = 'Lỗi tải sản phẩm: ' + p.error.message;
    } else loadErr = 'Không kết nối được Supabase.';
    applyCfg(); route();
  }
  function applyCfg() {
    const r = document.documentElement.style, c = cfg.c, f = cfg.font;
    r.setProperty('--bg', c.bg); r.setProperty('--card', c.card); r.setProperty('--ink', c.ink);
    r.setProperty('--fh', `'${f.h.split(':')[0]}'`); r.setProperty('--fb', `'${f.b.split(':')[0]}'`); r.setProperty('--fn', `'${f.n.split(':')[0]}'`);
    $('gf').href = 'https://fonts.googleapis.com/css2?' + [...new Set([f.h, f.b, f.n].filter(Boolean))].map(x => { const [n, ...w] = x.split(':'); return 'family=' + encodeURIComponent(n).replace(/%20/g, '+') + (w.length ? ':' + w.join(':') : ''); }).join('&') + '&display=swap';
    document.title = cfg.title; $('fav').href = cfg.favicon;
  }

  /* ---------- Các khối giao diện ---------- */
  const PG = ['home', 'products', 'size', 'contact'];
  const gal = a => `<section><div class="gal">${a.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join('')}</div></section>`;
  const SEC = {
    hero: () => `<section class="blue"><div class="in"><div class="ph">${cfg.hero.map(u => `<img src="${esc(u)}" alt="">`).join('')}</div><div class="big">${esc(cfg.big)}</div></div></section>`,
    gal: () => gal(cfg.gal),
    gal2: () => gal(cfg.gal2),
    prod: () => `<section class="blue sec" id="prod"><div class="in"><h2 class="ttl">${esc(cfg.prodTitle)}</h2>
      <div class="bar"><div id="chips"></div><select id="sort" aria-label="Sắp xếp"><option value="">Mới nhất</option><option value="asc">Giá: thấp → cao</option><option value="desc">Giá: cao → thấp</option></select></div>
      <div class="grid" id="grid"></div></div></section>`,
    size: () => {
      const h = cfg.sizeHead.map(esc), n = Math.max(cfg.sizeM.length, cfg.sizeF.length);
      const r = (a, i) => a[i] ? `<td>${esc(a[i].k)}</td><td>${esc(a[i].s)}</td>` : '<td></td><td></td>';
      return `<section class="sz"><div class="in"><h2 class="ttl">${esc(cfg.sizeTitle)}</h2><table>
        <tr><th colspan="2">${h[0]}</th><th colspan="2">${h[1]}</th></tr><tr><th>${h[2]}</th><th>${h[3]}</th><th>${h[2]}</th><th>${h[3]}</th></tr>
        ${Array.from({ length: n }, (_, i) => `<tr>${r(cfg.sizeM, i)}${r(cfg.sizeF, i)}</tr>`).join('')}</table></div></section>`;
    },
    stores: () => `<section class="blue sec"><div class="in"><h2 class="ttl">${esc(cfg.storeTitle)}</h2><div class="st">${cfg.stores.map(s => `
      <a href="${esc(s.link)}" target="_blank" rel="noopener"><img class="mp" src="${esc(s.img)}" alt="" loading="lazy"><div class="sa"><img src="${esc(cfg.homeIcon)}" alt=""><span>${esc(s.addr)}</span></div></a>`).join('')}</div></div></section>`,
    contact: () => `<section class="wh"><div class="in"><div class="ct"><img class="lg" src="${esc(cfg.logo)}" alt=""><div>${cfg.contacts.map(c => `
      <a class="cl" ${c.link ? `href="${esc(c.link)}" target="_blank" rel="noopener"` : ''}><img src="${esc(c.icon)}" alt=""><span>${esc(c.text)}</span></a>`).join('')}</div></div><p class="fol">${esc(cfg.follow)}</p></div></section>`
  };
  const navHref = u => PG.includes(u) ? '#' + u : esc(u);
  function hdr(pg) {
    return `<header class="blue"><div class="in hd"><div class="top"><a class="brand" href="#home">${esc(cfg.brand)}</a>
      <div class="sr"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" autocomplete="off" aria-label="Tìm kiếm sản phẩm">
      <button id="mic" type="button" aria-label="Tìm bằng giọng nói"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div></div>
      <nav>${cfg.nav.map(n => `<a href="${navHref(n.u)}" class="${n.u === pg ? 'on' : ''}">${esc(n.t)}</a>`).join('')}</nav></div></header>`;
  }
  function route() {
    const h = location.hash.slice(1), pg = PG.includes(h) ? h : 'home';
    const hadFocus = document.activeElement && document.activeElement.id === 'q';
    $('app').innerHTML = hdr(pg) + (cfg.pages[pg] || '').split(',').map(s => s.trim()).filter(Boolean).map(s => SEC[s] ? SEC[s]() : '').join('');
    bind(); renderChips(); renderProducts();
    if (hadFocus) { const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } else scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  function bind() {
    const q = $('q'); q.value = query;
    q.oninput = e => { query = e.target.value; if (!$('grid')) { location.hash = '#products'; return; } renderProducts(); };
    q.onkeydown = e => { if (e.key === 'Enter' && $('prod')) $('prod').scrollIntoView(); };
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    $('mic').onclick = () => {
      if (!SR) { alert('Trình duyệt này chưa hỗ trợ tìm kiếm bằng giọng nói (hãy dùng Chrome).'); return; }
      const r = new SR(); r.lang = 'vi-VN';
      r.onresult = ev => { query = ev.results[0][0].transcript; q.value = query; if (!$('grid')) location.hash = '#products'; else { renderProducts(); $('prod').scrollIntoView(); } };
      r.start();
    };
    if ($('sort')) { $('sort').value = sortBy; $('sort').onchange = e => { sortBy = e.target.value; renderProducts(); }; }
    if ($('chips')) $('chips').onclick = e => {
      const b = e.target.closest('.chip'); if (!b) return;
      activeCat = b.dataset.c ? Number(b.dataset.c) : null; renderChips(); renderProducts();
    };
    if ($('grid')) $('grid').onclick = e => { const a = e.target.closest('.p'); if (a) openProduct(Number(a.dataset.id)); };
  }

  /* ---------- Bộ lọc danh mục + sắp xếp giá ---------- */
  function descendantIds(id) {
    const set = new Set([id]); let grew = true;
    while (grew) { grew = false; categories.forEach(c => { if (c.parent_id && set.has(c.parent_id) && !set.has(c.id)) { set.add(c.id); grew = true; } }); }
    return set;
  }
  function rootOf(id) {
    let c = categories.find(x => x.id === id);
    while (c && c.parent_id) c = categories.find(x => x.id === c.parent_id);
    return c ? c.id : null;
  }
  function renderChips() {
    const el = $('chips'); if (!el) return;
    const roots = categories.filter(c => !c.parent_id);
    if (!roots.length) { el.innerHTML = ''; return; }
    const rid = activeCat ? rootOf(activeCat) : null, kids = rid ? categories.filter(c => c.parent_id === rid) : [];
    const b = (id, t) => `<button type="button" class="chip ${activeCat === id ? 'on' : ''}" data-c="${id ?? ''}">${esc(t)}</button>`;
    el.innerHTML = b(null, 'Tất cả') + roots.map(c => b(c.id, c.name)).join('') + (kids.length ? '<span class="brk"></span>' + kids.map(c => b(c.id, '↳ ' + c.name)).join('') : '');
  }
  function renderProducts() {
    const g = $('grid'); if (!g) return;
    const ids = activeCat ? descendantIds(activeCat) : null, q = norm(query.trim());
    let list = products.filter(p => (!ids || ids.has(p.category_id)) && (!q || norm(p.name).includes(q)));
    if (sortBy) list = [...list].sort((a, b) => sortBy === 'asc' ? Number(a.price) - Number(b.price) : Number(b.price) - Number(a.price));
    shown = list.map(p => p.id);
    if (!list.length) { g.innerHTML = '<div class="empty">' + esc(loadErr || (products.length ? 'Không tìm thấy sản phẩm phù hợp.' : 'Chưa có sản phẩm nào.')) + '</div>'; return; }
    g.innerHTML = list.map(p => `
      <article class="p" data-id="${p.id}">
        <div class="pi"><img loading="lazy" src="${esc(mainImg(p))}" alt="${esc(p.name)}"></div>
        <b class="pn">${esc(p.name)}</b>
        <i class="pp">${money(p.price)}${p.old_price && Number(p.old_price) > Number(p.price) ? `<s>${money(p.old_price)}</s>` : ''}</i>
        ${p.description ? `<p class="pd">${esc(p.description)}</p>` : ''}
      </article>`).join('');
  }

  /* ---------- Modal sản phẩm (lướt trái/phải xem sản phẩm kế cận) ---------- */
  let cur = null, curSize = null, curQty = 1;
  function openProduct(id) {
    cur = products.find(p => p.id === id); if (!cur) return;
    curSize = null; curQty = 1;
    const imgs = allImgs(cur), sizes = cur.sizes || [], i = shown.indexOf(id);
    $('modal').innerHTML = `
      <button class="x" id="m-x" aria-label="Đóng">✕</button>
      <div>
        <img class="m-main" id="m-main" src="${esc(imgs[0] || '')}" alt="" draggable="false">
        ${imgs.length > 1 ? `<div class="m-thumbs">${imgs.map((u, k) => `<img src="${esc(u)}" data-i="${k}" class="${k === 0 ? 'on' : ''}" alt="">`).join('')}</div>` : ''}
      </div>
      <div class="m-info">
        ${i > -1 && shown.length > 1 ? `<div class="m-cnt">${i + 1} / ${shown.length} · lướt trái/phải để xem sản phẩm khác</div>` : ''}
        <h2>${esc(cur.name)}</h2>
        <div class="m-price"><span class="p-price">${money(cur.price)}</span>${cur.old_price && Number(cur.old_price) > Number(cur.price) ? `<span class="p-old">${money(cur.old_price)}</span>` : ''}</div>
        ${cur.description ? `<p class="m-desc">${esc(cur.description)}</p>` : ''}
        ${sizes.length ? `<div class="m-label">Chọn size</div><div class="sizes">${sizes.map(s => `<button class="size" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
        <div class="m-label">Số lượng</div>
        <div class="qty"><button id="q-" aria-label="Giảm">−</button><b id="q-n">1</b><button id="q+" aria-label="Tăng">+</button></div>
        <div class="warn" id="m-warn"></div>
        <button class="btn" id="m-add">THÊM VÀO GIỎ HÀNG</button>
      </div>`;
    $('modal').scrollTop = 0;
    $('back').classList.add('on'); $('modal').classList.add('on'); document.body.style.overflow = 'hidden';
  }
  function go(d) {
    if (!cur) return;
    const n = shown.indexOf(cur.id) + d;
    if (n >= 0 && n < shown.length) openProduct(shown[n]);
  }
  $('nvl').onclick = () => go(-1); $('nvr').onclick = () => go(1);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAll();
    if ($('modal').classList.contains('on') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); }
  });
  let sx = 0, sy = 0, sw = false;
  $('modal').addEventListener('pointerdown', e => { if (e.target.closest('button,input')) return; sx = e.clientX; sy = e.clientY; sw = true; });
  $('modal').addEventListener('pointerup', e => {
    if (!sw) return; sw = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
  });
  function closeAll() {
    $('modal').classList.remove('on'); $('cart').classList.remove('on'); $('back').classList.remove('on'); document.body.style.overflow = '';
  }
  $('back').addEventListener('click', closeAll);
  $('modal').addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'm-x') return closeAll();
    if (t.matches('.m-thumbs img')) {
      $('m-main').src = t.src;
      document.querySelectorAll('.m-thumbs img').forEach(i => i.classList.toggle('on', i === t));
    }
    if (t.matches('.size')) {
      curSize = t.dataset.s;
      document.querySelectorAll('.size').forEach(i => i.classList.toggle('on', i === t));
      $('m-warn').textContent = '';
    }
    if (t.id === 'q-') { curQty = Math.max(1, curQty - 1); $('q-n').textContent = curQty; }
    if (t.id === 'q+') { curQty = Math.min(99, curQty + 1); $('q-n').textContent = curQty; }
    if (t.id === 'm-add') {
      if ((cur.sizes || []).length && !curSize) { $('m-warn').textContent = 'Vui lòng chọn size trước khi thêm vào giỏ.'; return; }
      const key = cur.id + '|' + (curSize || '');
      const ex = cart.find(i => i.key === key);
      if (ex) ex.qty += curQty;
      else cart.push({ key, id: cur.id, name: cur.name, price: Number(cur.price), image: mainImg(cur), selectedSize: curSize, qty: curQty });
      saveCart(); closeAll(); openCart();
    }
  });

  /* ---------- Giỏ hàng ---------- */
  const saveCart = () => { try { localStorage.setItem('cart_v1', JSON.stringify(cart)); } catch (e) {} renderCart(); };
  const cartTotal = () => cart.reduce((s, i) => s + i.price * i.qty, 0);
  function renderCart() {
    $('fab-n').textContent = cart.reduce((s, i) => s + i.qty, 0);
    $('ci-total').textContent = money(cartTotal());
    $('ci-list').innerHTML = cart.length ? cart.map(i => `
      <div class="ci">
        <img src="${esc(i.image)}" alt="">
        <div style="flex:1">
          <div class="ci-n">${esc(i.name)}</div>
          <div class="ci-s">${i.selectedSize ? 'Size ' + esc(i.selectedSize) + ' · ' : ''}${money(i.price)}</div>
          <div class="ci-r">
            <div><button data-k="${esc(i.key)}" data-a="-">−</button><span>${i.qty}</span><button data-k="${esc(i.key)}" data-a="+">+</button></div>
            <button class="ci-del" data-k="${esc(i.key)}" data-a="x">Xóa</button>
          </div>
        </div>
      </div>`).join('') : '<p style="color:#666;text-align:center;padding:40px 0">Giỏ hàng đang trống.</p>';
  }
  $('ci-list').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const it = cart.find(i => i.key === b.dataset.k); if (!it) return;
    if (b.dataset.a === '+') it.qty++;
    if (b.dataset.a === '-') it.qty = Math.max(1, it.qty - 1);
    if (b.dataset.a === 'x') cart = cart.filter(i => i !== it);
    saveCart();
  });
  function openCart() { $('order-msg').textContent = ''; $('back').classList.add('on'); $('cart').classList.add('on'); document.body.style.overflow = 'hidden'; }
  $('fab').addEventListener('click', openCart);

  /* ===== Báo đơn về Telegram (giữ nguyên) ===== */
  async function sendTelegramNotification(orderInfo) {
    if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;

    const formattedCode = `1607${orderInfo.orderId}`;
    let itemsText = orderInfo.items.map(i => `• ${i.name} ${i.selectedSize ? `(Size: ${i.selectedSize})` : ''} - SL: ${i.qty}`).join('\n');

    let message = `🛒 *CÓ ĐƠN HÀNG MỚI!* (#${formattedCode})\n\n` +
                  `👤 *Khách hàng:* ${orderInfo.name}\n` +
                  `📞 *SĐT:* ${orderInfo.phone}\n` +
                  `📍 *Địa chỉ:* ${orderInfo.address}\n` +
                  `📝 *Ghi chú:* ${orderInfo.note || 'Không có'}\n\n` +
                  `📦 *Sản phẩm:*\n${itemsText}\n\n` +
                  `💰 *Tổng tiền:* ${Number(orderInfo.total).toLocaleString('vi-VN')} đ`;

    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'Markdown'
        })
      });
    } catch (err) {
      console.error("Lỗi gửi Telegram:", err);
    }
  }

  /* ===== Đặt hàng: lưu Supabase -> báo Telegram -> hiện lời cảm ơn (giữ nguyên) ===== */
  $('checkout').addEventListener('submit', submitOrder);
  async function submitOrder(e) {
    e.preventDefault();
    if (cart.length === 0) return alert('Giỏ hàng trống!');

    const btn = document.getElementById('f-btn');
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ĐANG XỬ LÝ...`;

    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const address = document.getElementById('f-addr').value.trim();
    const note = document.getElementById('f-note').value.trim();
    const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    const cartSnapshot = [...cart];

    const { data, error } = await db.from('orders').insert([{
      customer_name: name,
      customer_phone: phone,
      address: address,
      note: note,
      total_amount: total,
      cart_items: cartSnapshot
    }]).select();

    if (!error) {
      const rawId = data && data[0] ? data[0].id : 'NEW';
      const formattedOrderId = `1607${rawId}`;

      await sendTelegramNotification({
        orderId: rawId,
        name: name,
        phone: phone,
        address: address,
        note: note,
        items: cartSnapshot,
        total: total
      });

      closeAll();
      document.getElementById('checkout').reset();
      cart = [];
      saveCart();

      showThankYouModal({
        name: name,
        phone: phone,
        orderId: formattedOrderId,
        total: total
      });
    } else {
      alert("Lỗi đặt hàng: " + error.message);
    }
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> XÁC NHẬN ĐẶT HÀNG`;
  }

  function showThankYouModal(info) {
    let modal = document.getElementById('thankYouModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'thankYouModal';
      document.body.appendChild(modal);
    }

    modal.innerHTML = `
      <div>
        <div class="ty-ico">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2>ĐẶT HÀNG THÀNH CÔNG!</h2>
        <p class="ty-code">Mã đơn hàng của bạn: <b>#${info.orderId}</b></p>

        <div class="ty-box">
          <p><b>Khách hàng:</b> ${info.name}</p>
          <p><b>Số điện thoại:</b> ${info.phone}</p>
          <p><b>Tổng thanh toán:</b> <span class="ty-red">${Number(info.total).toLocaleString('vi-VN')} ₫</span></p>
          <hr>
          <p class="ty-quote">
            "Cảm ơn Quý khách <b>${info.name}</b> đã tin tưởng. Nhân viên CSKH sẽ kết bạn và nhắn tin qua Zalo <b>${info.phone}</b> để kiểm tra lại thông tin giao hàng và tư vấn chi tiết cho anh/chị nhé. Chúc anh/chị một ngày tốt lành!"
          </p>
        </div>

        <button class="ty-btn" onclick="document.getElementById('thankYouModal').remove()">
          HOÀN TẤT & TIẾP TỤC MUA SẮM
        </button>
      </div>
    `;
  }

  renderCart();
  route();   // hiện ngay giao diện mặc định, rồi nạp dữ liệu thật
  load();
</script>
</body>
</html>
