<!-- CSS theo khung thiết kế PDF 1024px: "36u" = 36 đơn vị thiết kế, tự co giãn theo chiều ngang màn hình -->
<style type="text/u">

button,input,select,textarea{font-family:inherit}button{cursor:pointer}img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
#app{container-type:inline-size;--u:calc(min(100cqw,1600px)/1024)}
.blue{background:var(--bg);color:#fff}

.hd{padding-top:22u}

.ph{display:grid;grid-template-columns:repeat(3,305u);gap:18u;padding:15u 36u 0}.ph img{width:305u;height:260u;object-fit:cover}

</style>
<script>
  // đổi "36u" -> calc(36*var(--u))
  const _s = document.querySelector('style[type="text/u"]').textContent;
  const _e = document.createElement('style');
  _e.textContent = _s.replace(/(?<![\w.#-])(-?\d*\.?\d+)u(?![\w-])/g, 'calc($1*var(--u))');
  document.head.appendChild(_e);
</script>

<script>
  const TELEGRAM_BOT_TOKEN = "8715013237:AAHnalBgr7rnIeJewh3GMr_tfFnv8ewJipY";
  const TELEGRAM_CHAT_ID = "8866272456";

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => Number(n || 0).toLocaleString('vi-VN') + ' đ';
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
  const EDIT = new URLSearchParams(location.search).has('edit');

  let db = null;
  try { db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY); } catch (e) { console.error(e); }

  let cfg = clone(DEFAULTS), products = [], categories = [], activeCat = null, query = '', sortBy = '', shown = [], loadErr = '', curPg = 'home', selKey = null;
  let cart = [];
  try { cart = JSON.parse(localStorage.getItem('cart_v1') || '[]'); } catch (e) {}

  const mainImg = p => p.main_image || p.image_url || (p.images && p.images[0]) || '';
  const allImgs = p => (p.images && p.images.length ? p.images : [mainImg(p)]).filter(Boolean);

  /* ---------- Tải dữ liệu + áp giao diện ---------- */
  async function load() {
    if (db) {
      const [s, c, p] = await Promise.all([
        db.from('site_settings').select('data').eq('id', 'main').maybeSingle(),
        db.from('categories').select('*').order('id', { ascending: true }),
        db.from('products').select('*').order('id', { ascending: false })
      ]);
      cfg = merge(DEFAULTS, s.data && s.data.data);
      categories = c.data || []; products = p.data || [];
      if (p.error) loadErr = 'Lỗi tải sản phẩm: ' + p.error.message;
    } else loadErr = 'Không kết nối được Supabase.';
    applyCfg(); route();
    if (window.parent !== window && window.parent.onReady) window.parent.onReady();
  }
  const SYS = ['Arial', 'Arial Black', 'Helvetica', 'Times New Roman'];
  const fam = x => String(x || '').split(':')[0];
  function applyCfg() {
    const r = document.documentElement.style, c = cfg.c, f = cfg.font;
    r.setProperty('--bg', c.bg); r.setProperty('--card', c.card); r.setProperty('--ink', c.ink);
    r.setProperty('--fh', `'${fam(f.h)}'`); r.setProperty('--fb', `'${fam(f.b)}'`); r.setProperty('--fn', `'${fam(f.n)}'`);
    const all = [f.h, f.b, f.n, ...Object.values(cfg.st || {}).map(s => s.ff)].filter(x => x && !SYS.includes(fam(x)));
    const seen = {}; all.forEach(x => { if (!seen[fam(x)] || x.includes(':')) seen[fam(x)] = x; });
    const url = 'https://fonts.googleapis.com/css2?' + Object.values(seen).map(x => { const [n, ...w] = x.split(':'); return 'family=' + encodeURIComponent(n).replace(/%20/g, '+') + (w.length ? ':' + w.join(':') : ''); }).join('&') + '&display=swap';
    if ($('gf').getAttribute('href') !== url) $('gf').href = url;
    document.title = cfg.title; $('fav').href = cfg.favicon;
    $('zl').href = cfg.zalo.link; $('zl-i').src = cfg.zalo.icon;
  }
  /* Áp kiểu riêng (font, cỡ chữ, màu, nền...) do trình dựng giao diện lưu trong cfg.st */
  function applySt() {
    document.querySelectorAll('[data-k],[data-sec]').forEach(el => {
      const k = el.dataset.k || ('sec:' + el.dataset.sec), s = (cfg.st || {})[k];
      ['color', 'fontFamily', 'fontWeight', 'fontStyle', 'textAlign', 'background', 'fontSize', 'paddingTop', 'paddingBottom'].forEach(p => el.style[p] = '');
      if (!s) return;
      if (s.color) el.style.color = s.color;
      if (s.ff) el.style.fontFamily = `'${fam(s.ff)}',sans-serif`;
      if (s.fw) el.style.fontWeight = s.fw;
      if (s.fi) el.style.fontStyle = 'italic';
      if (s.ta) el.style.textAlign = s.ta;
      if (s.bg) el.style.background = s.bg;
      if (s.pt !== undefined && s.pt !== '') el.style.paddingTop = `calc(${s.pt}*var(--u))`;
      if (s.pb !== undefined && s.pb !== '') el.style.paddingBottom = `calc(${s.pb}*var(--u))`;
      if (s.fs && Number(s.fs) !== 100 && !(el.namespaceURI || '').includes('svg')) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * s.fs / 100) + 'px';
    });
  }
  let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(applySt, 150); });

  /* ---------- Các khối giao diện (data-k / data-img / data-sec để trình dựng nhận diện) ---------- */
  const PG = ['home', 'products', 'size', 'contact'];
  const gal = (a, n) => `<section class="gal" data-sec="${n}"><div class="in">${a.map((u, i) => `<img data-img="${n}.${i}" src="${esc(u)}" alt="" loading="lazy">`).join('')}</div></section>`;
  const SEC = {
    hero: () => `<section class="blue hero" data-sec="hero"><div class="in"><div class="ph">${cfg.hero.map((u, i) => `<img data-img="hero.${i}" src="${esc(u)}" alt="">`).join('')}</div>
      <svg class="big" data-k="big" viewBox="0 0 1024 175"><text x="45" y="160" font-size="223" textLength="${Math.min(939, Math.max(1, cfg.big.length) * 134)}" lengthAdjust="spacingAndGlyphs">${esc(cfg.big)}</text></svg></div></section>`,
    gal: () => gal(cfg.gal, 'gal'),
    gal2: () => gal(cfg.gal2, 'gal2'),
    prod: () => `<section class="blue sec" id="prod" data-sec="prod"><div class="in"><h2 class="ttl" data-k="prodTitle">${esc(cfg.prodTitle)}</h2>
      <div class="bar"><div id="chips"></div><select id="sort" aria-label="Sắp xếp"><option value="">Mới nhất</option><option value="asc">Giá: thấp → cao</option><option value="desc">Giá: cao → thấp</option></select></div>
      <div class="grid" id="grid"></div></div></section>`,
    size: () => {
      const h = cfg.sizeHead, n = Math.max(cfg.sizeM.length, cfg.sizeF.length);
      const r = (a, p, i) => a[i] ? `<td data-k="${p}.${i}.k">${esc(a[i].k)}</td><td data-k="${p}.${i}.s">${esc(a[i].s)}</td>` : '<td></td><td></td>';
      return `<section class="sz" data-sec="size"><div class="in"><h2 class="ttl" data-k="sizeTitle">${esc(cfg.sizeTitle)}</h2><table>
        <tr><th colspan="2" data-k="sizeHead.0">${esc(h[0])}</th><th colspan="2" data-k="sizeHead.1">${esc(h[1])}</th></tr>
        <tr><th data-k="sizeHead.2">${esc(h[2])}</th><th data-k="sizeHead.3">${esc(h[3])}</th><th>${esc(h[2])}</th><th>${esc(h[3])}</th></tr>
        ${Array.from({ length: n }, (_, i) => `<tr>${r(cfg.sizeM, 'sizeM', i)}${r(cfg.sizeF, 'sizeF', i)}</tr>`).join('')}</table></div></section>`;
    },
    stores: () => `<section class="blue stores" data-sec="stores"><div class="in"><h2 class="ttl" data-k="storeTitle">${esc(cfg.storeTitle)}</h2><div class="st">${cfg.stores.map((s, i) => `
      <a href="${esc(s.link)}" target="_blank" rel="noopener"><img class="mp" data-img="stores.${i}.img" src="${esc(s.img)}" alt="" loading="lazy"><div class="sa"><img data-img="homeIcon" src="${esc(cfg.homeIcon)}" alt=""><span data-k="stores.${i}.addr">${esc(s.addr)}</span></div></a>`).join('')}</div></div></section>`,
    contact: () => `<section class="wh" data-sec="contact"><div class="in"><div class="ct"><img class="lg" data-img="logo" src="${esc(cfg.logo)}" alt=""><div>${cfg.contacts.map((c, i) => `
      <a class="cl" ${c.link ? `href="${esc(c.link)}" target="_blank" rel="noopener"` : ''}><img data-img="contacts.${i}.icon" src="${esc(c.icon)}" alt=""><span data-k="contacts.${i}.text">${esc(c.text)}</span></a>`).join('')}</div></div><p class="fol" data-k="follow">${esc(cfg.follow)}</p></div></section>`
  };
  const navHref = u => PG.includes(u) ? '#' + u : esc(u);
  function hdr(pg) {
    return `<header class="blue" data-sec="header"><div class="in hd"><div class="top"><a class="brand" href="#home" data-k="brand">${esc(cfg.brand)}</a>
      <div class="sr"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" autocomplete="off" aria-label="Tìm kiếm sản phẩm">
      <button id="mic" type="button" aria-label="Tìm bằng giọng nói"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div></div>
      <nav>${cfg.nav.map((n, i) => `<a href="${navHref(n.u)}" class="${n.u === pg ? 'on' : ''}" data-k="nav.${i}.t">${esc(n.t)}</a>`).join('')}</nav></div></header>`;
  }
  function route() {
    const h = location.hash.slice(1), pg = PG.includes(h) ? h : 'home'; curPg = pg;
    const hadFocus = document.activeElement && document.activeElement.id === 'q';
    $('app').innerHTML = hdr(pg) + (cfg.pages[pg] || '').split(',').map(s => s.trim()).filter(Boolean).map(s => SEC[s] ? SEC[s]() : '').join('');
    bind(); renderChips(); renderProducts(); applySt(); reselect();
    if (hadFocus) { const q = $('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); } else if (!EDIT) scrollTo(0, 0);
  }
  window.addEventListener('hashchange', route);

  function bind() {
    const q = $('q'); q.value = query;
    q.oninput = e => { query = e.target.value; if (!$('grid')) { location.hash = '#products'; return; } renderProducts(); };
    q.onkeydown = e => { if (e.key === 'Enter' && $('prod')) $('prod').scrollIntoView(); };
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    $('mic').onclick = () => {
      if (!SR) { alert('Trình duyệt này chưa hỗ trợ tìm kiếm bằng giọng nói (hãy dùng Chrome).'); return; }
      const r = new SR(); r.lang = 'vi-VN';
      r.onresult = ev => { query = ev.results[0][0].transcript; q.value = query; if (!$('grid')) location.hash = '#products'; else { renderProducts(); $('prod').scrollIntoView(); } };
      r.start();
    };
    if ($('sort')) { $('sort').value = sortBy; $('sort').onchange = e => { sortBy = e.target.value; renderProducts(); }; }
    if ($('chips')) $('chips').onclick = e => {
      const b = e.target.closest('.chip'); if (!b) return;
      activeCat = b.dataset.c ? Number(b.dataset.c) : null; renderChips(); renderProducts();
    };
    if ($('grid')) $('grid').onclick = e => { const a = e.target.closest('.p'); if (a) openProduct(Number(a.dataset.id)); };
  }

  /* ---------- Bộ lọc danh mục + sắp xếp giá ---------- */
  function descendantIds(id) {
    const set = new Set([id]); let grew = true;
    while (grew) { grew = false; categories.forEach(c => { if (c.parent_id && set.has(c.parent_id) && !set.has(c.id)) { set.add(c.id); grew = true; } }); }
    return set;
  }
  function rootOf(id) {
    let c = categories.find(x => x.id === id);
    while (c && c.parent_id) c = categories.find(x => x.id === c.parent_id);
    return c ? c.id : null;
  }
  function renderChips() {
    const el = $('chips'); if (!el) return;
    const roots = categories.filter(c => !c.parent_id);
    if (!roots.length) { el.innerHTML = ''; return; }
    const rid = activeCat ? rootOf(activeCat) : null, kids = rid ? categories.filter(c => c.parent_id === rid) : [];
    const b = (id, t) => `<button type="button" class="chip ${activeCat === id ? 'on' : ''}" data-c="${id ?? ''}">${esc(t)}</button>`;
    el.innerHTML = b(null, 'Tất cả') + roots.map(c => b(c.id, c.name)).join('') + (kids.length ? '<span class="brk"></span>' + kids.map(c => b(c.id, '↳ ' + c.name)).join('') : '');
  }
  function renderProducts() {
    const g = $('grid'); if (!g) return;
    const ids = activeCat ? descendantIds(activeCat) : null, q = norm(query.trim());
    let list = products.filter(p => (!ids || ids.has(p.category_id)) && (!q || norm(p.name).includes(q)));
    if (sortBy) list = [...list].sort((a, b) => sortBy === 'asc' ? Number(a.price) - Number(b.price) : Number(b.price) - Number(a.price));
    shown = list.map(p => p.id);
    if (!list.length) { g.innerHTML = '<div class="empty">' + esc(loadErr || (products.length ? 'Không tìm thấy sản phẩm phù hợp.' : 'Chưa có sản phẩm nào.')) + '</div>'; return; }
    g.innerHTML = list.map(p => `
      <article class="p" data-id="${p.id}">
        <div class="pi"><img loading="lazy" src="${esc(mainImg(p))}" alt="${esc(p.name)}"></div>
        <b class="pn">${esc(p.name)}</b>
        <i class="pp">${money(p.price)}${p.old_price && Number(p.old_price) > Number(p.price) ? `<s>${money(p.old_price)}</s>` : ''}</i>
        ${p.description ? `<p class="pd">${esc(p.description)}</p>` : ''}
      </article>`).join('');
  }

  /* ---------- Modal sản phẩm (lướt trái/phải + Mua ngay qua Zalo) ---------- */
  let cur = null, curSize = null, curQty = 1;
  function openProduct(id) {
    cur = products.find(p => p.id === id); if (!cur) return;
    curSize = null; curQty = 1;
    const imgs = allImgs(cur), sizes = cur.sizes || [], i = shown.indexOf(id);
    $('modal').innerHTML = `
      <button class="x" id="m-x" aria-label="Đóng">✕</button>
      <div>
        <img class="m-main" id="m-main" src="${esc(imgs[0] || '')}" alt="" draggable="false">
        ${imgs.length > 1 ? `<div class="m-thumbs">${imgs.map((u, k) => `<img src="${esc(u)}" data-i="${k}" class="${k === 0 ? 'on' : ''}" alt="">`).join('')}</div>` : ''}
      </div>
      <div class="m-info">
        ${i > -1 && shown.length > 1 ? `<div class="m-cnt">${i + 1} / ${shown.length} · lướt trái/phải để xem sản phẩm khác</div>` : ''}
        <h2>${esc(cur.name)}</h2>
        <div class="m-price"><span class="p-price">${money(cur.price)}</span>${cur.old_price && Number(cur.old_price) > Number(cur.price) ? `<span class="p-old">${money(cur.old_price)}</span>` : ''}</div>
        ${cur.description ? `<p class="m-desc">${esc(cur.description)}</p>` : ''}
        ${sizes.length ? `<div class="m-label">Chọn size</div><div class="sizes">${sizes.map(s => `<button class="size" data-s="${esc(s)}">${esc(s)}</button>`).join('')}</div>` : ''}
        <div class="m-label">Số lượng</div>
        <div class="qty"><button id="q-" aria-label="Giảm">−</button><b id="q-n">1</b><button id="q+" aria-label="Tăng">+</button></div>
        <div class="warn" id="m-warn"></div>
        <button class="btn" id="m-add">THÊM VÀO GIỎ HÀNG</button>
        <button class="btn buy" id="m-buy">MUA NGAY (CHAT ZALO)</button>
      </div>`;
    $('modal').scrollTop = 0;
    $('back').classList.add('on'); $('modal').classList.add('on'); document.body.style.overflow = 'hidden';
  }
  function go(d) {
    if (!cur) return;
    const n = shown.indexOf(cur.id) + d;
    if (n >= 0 && n < shown.length) openProduct(shown[n]);
  }
  $('nvl').onclick = () => go(-1); $('nvr').onclick = () => go(1);
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeAll();
    if ($('modal').classList.contains('on') && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { if (e.key === 'ArrowLeft') go(-1); if (e.key === 'ArrowRight') go(1); }
  });
  let sx = 0, sy = 0, sw = false;
  $('modal').addEventListener('pointerdown', e => { if (e.target.closest('button,input')) return; sx = e.clientX; sy = e.clientY; sw = true; });
  $('modal').addEventListener('pointerup', e => {
    if (!sw) return; sw = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1);
  });
  function closeAll() {
    $('modal').classList.remove('on'); $('cart').classList.remove('on'); $('back').classList.remove('on'); document.body.style.overflow = '';
  }
  $('back').addEventListener('click', closeAll);
  $('modal').addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'm-x') return closeAll();
    if (t.matches('.m-thumbs img')) {
      $('m-main').src = t.src;
      document.querySelectorAll('.m-thumbs img').forEach(i => i.classList.toggle('on', i === t));
    }
    if (t.matches('.size')) {
      curSize = t.dataset.s;
      document.querySelectorAll('.size').forEach(i => i.classList.toggle('on', i === t));
      $('m-warn').textContent = '';
    }
    if (t.id === 'q-') { curQty = Math.max(1, curQty - 1); $('q-n').textContent = curQty; }
    if (t.id === 'q+') { curQty = Math.min(99, curQty + 1); $('q-n').textContent = curQty; }
    if (t.id === 'm-add') {
      if ((cur.sizes || []).length && !curSize) { $('m-warn').textContent = 'Vui lòng chọn size trước khi thêm vào giỏ.'; return; }
      const key = cur.id + '|' + (curSize || '');
      const ex = cart.find(i => i.key === key);
      if (ex) ex.qty += curQty;
      else cart.push({ key, id: cur.id, name: cur.name, price: Number(cur.price), image: mainImg(cur), selectedSize: curSize, qty: curQty });
      saveCart(); closeAll(); openCart();
    }
    if (t.id === 'm-buy') {   // Mua ngay -> chuyển sang Zalo, tự sao chép thông tin sản phẩm để dán vào chat
      if ((cur.sizes || []).length && !curSize) { $('m-warn').textContent = 'Vui lòng chọn size trước khi mua.'; return; }
      const msg = `Mình muốn mua: ${cur.name}\n${curSize ? 'Size: ' + curSize + '\n' : ''}Số lượng: ${curQty}\nGiá: ${money(cur.price)}`;
      try { navigator.clipboard.writeText(msg); } catch (err) {}
      $('m-warn').style.color = '#0068ff'; $('m-warn').textContent = 'Đã sao chép thông tin sản phẩm — dán vào khung chat Zalo nhé!';
      window.open(cfg.zalo.link, '_blank');
    }
  });

  /* ---------- Giỏ hàng ---------- */
  const saveCart = () => { try { localStorage.setItem('cart_v1', JSON.stringify(cart)); } catch (e) {} renderCart(); };
  const cartTotal = () => cart.reduce((s, i) => s + i.price * i.qty, 0);
  function renderCart() {
    $('fab-n').textContent = cart.reduce((s, i) => s + i.qty, 0);
    $('ci-total').textContent = money(cartTotal());
    $('ci-list').innerHTML = cart.length ? cart.map(i => `
      <div class="ci">
        <img src="${esc(i.image)}" alt="">
        <div style="flex:1">
          <div class="ci-n">${esc(i.name)}</div>
          <div class="ci-s">${i.selectedSize ? 'Size ' + esc(i.selectedSize) + ' · ' : ''}${money(i.price)}</div>
          <div class="ci-r">
            <div><button data-k="${esc(i.key)}" data-a="-">−</button><span>${i.qty}</span><button data-k="${esc(i.key)}" data-a="+">+</button></div>
            <button class="ci-del" data-k="${esc(i.key)}" data-a="x">Xóa</button>
          </div>
        </div>
      </div>`).join('') : '<p style="color:#666;text-align:center;padding:40px 0">Giỏ hàng đang trống.</p>';
  }
  $('ci-list').addEventListener('click', e => {
    const b = e.target.closest('button[data-k]'); if (!b) return;
    const it = cart.find(i => i.key === b.dataset.k); if (!it) return;
    if (b.dataset.a === '+') it.qty++;
    if (b.dataset.a === '-') it.qty = Math.max(1, it.qty - 1);
    if (b.dataset.a === 'x') cart = cart.filter(i => i !== it);
    saveCart();
  });
  function openCart() { $('order-msg').textContent = ''; $('back').classList.add('on'); $('cart').classList.add('on'); document.body.style.overflow = 'hidden'; }
  $('fab').addEventListener('click', openCart);

  /* ===== Báo đơn về Telegram (giữ nguyên) ===== */
  async function sendTelegramNotification(orderInfo) {
    if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;

    const formattedCode = `1607${orderInfo.orderId}`;
    let itemsText = orderInfo.items.map(i => `• ${i.name} ${i.selectedSize ? `(Size: ${i.selectedSize})` : ''} - SL: ${i.qty}`).join('\n');

    let message = `🛒 *CÓ ĐƠN HÀNG MỚI!* (#${formattedCode})\n\n` +
                  `👤 *Khách hàng:* ${orderInfo.name}\n` +
                  `📞 *SĐT:* ${orderInfo.phone}\n` +
                  `📍 *Địa chỉ:* ${orderInfo.address}\n` +
                  `📝 *Ghi chú:* ${orderInfo.note || 'Không có'}\n\n` +
                  `📦 *Sản phẩm:*\n${itemsText}\n\n` +
                  `💰 *Tổng tiền:* ${Number(orderInfo.total).toLocaleString('vi-VN')} đ`;

    try {
      await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          chat_id: TELEGRAM_CHAT_ID,
          text: message,
          parse_mode: 'Markdown'
        })
      });
    } catch (err) {
      console.error("Lỗi gửi Telegram:", err);
    }
  }

  /* ===== Đặt hàng: lưu Supabase -> báo Telegram -> hiện lời cảm ơn (giữ nguyên) ===== */
  $('checkout').addEventListener('submit', submitOrder);
  async function submitOrder(e) {
    e.preventDefault();
    if (cart.length === 0) return alert('Giỏ hàng trống!');

    const btn = document.getElementById('f-btn');
    btn.disabled = true;
    btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> ĐANG XỬ LÝ...`;

    const name = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const address = document.getElementById('f-addr').value.trim();
    const note = document.getElementById('f-note').value.trim();
    const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
    const cartSnapshot = [...cart];

    const { data, error } = await db.from('orders').insert([{
      customer_name: name,
      customer_phone: phone,
      address: address,
      note: note,
      total_amount: total,
      cart_items: cartSnapshot
    }]).select();

    if (!error) {
      const rawId = data && data[0] ? data[0].id : 'NEW';
      const formattedOrderId = `1607${rawId}`;

      await sendTelegramNotification({
        orderId: rawId,
        name: name,
        phone: phone,
        address: address,
        note: note,
        items: cartSnapshot,
        total: total
      });

      closeAll();
      document.getElementById('checkout').reset();
      cart = [];
      saveCart();

      showThankYouModal({
        name: name,
        phone: phone,
        orderId: formattedOrderId,
        total: total
      });
    } else {
      alert("Lỗi đặt hàng: " + error.message);
    }
    btn.disabled = false;
    btn.innerHTML = `<i class="fa-solid fa-check-circle"></i> XÁC NHẬN ĐẶT HÀNG`;
  }

  function showThankYouModal(info) {
    let modal = document.getElementById('thankYouModal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'thankYouModal';
      document.body.appendChild(modal);
    }

    modal.innerHTML = `
      <div>
        <div class="ty-ico">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <h2>ĐẶT HÀNG THÀNH CÔNG!</h2>
        <p class="ty-code">Mã đơn hàng của bạn: <b>#${info.orderId}</b></p>

        <div class="ty-box">
          <p><b>Khách hàng:</b> ${info.name}</p>
          <p><b>Số điện thoại:</b> ${info.phone}</p>
          <p><b>Tổng thanh toán:</b> <span class="ty-red">${Number(info.total).toLocaleString('vi-VN')} ₫</span></p>
          <hr>
          <p class="ty-quote">
            "Cảm ơn Quý khách <b>${info.name}</b> đã tin tưởng. Nhân viên CSKH sẽ kết bạn và nhắn tin qua Zalo <b>${info.phone}</b> để kiểm tra lại thông tin giao hàng và tư vấn chi tiết cho anh/chị nhé. Chúc anh/chị một ngày tốt lành!"
          </p>
        </div>

        <button class="ty-btn" onclick="document.getElementById('thankYouModal').remove()">
          HOÀN TẤT & TIẾP TỤC MUA SẮM
        </button>
      </div>
    `;
  }

  /* ===== Chế độ chỉnh sửa (chỉ bật khi mở từ trang admin: index.html?edit=1) ===== */
  window.__cfg = () => cfg;
  window.__set = c => { cfg = c; applyCfg(); route(); };
  window.__redraw = () => { applyCfg(); route(); };
  window.__page = () => curPg;
  function reselect() {
    document.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
    if (!EDIT || !selKey) return;
    const el = document.querySelector(`[data-k="${selKey}"],[data-img="${selKey}"],[data-sec="${selKey}"]`);
    if (el) el.classList.add('sel');
  }
  if (EDIT) {
    document.body.classList.add('edm');
    document.addEventListener('click', e => {
      if (e.target.isContentEditable) return;
      e.preventDefault(); e.stopPropagation();
      const t = e.target.closest('[data-k],[data-img]') || e.target.closest('[data-sec]'); if (!t) return;
      selKey = t.dataset.k || t.dataset.img || t.dataset.sec; reselect();
      if (window.parent.onSel) window.parent.onSel(t.dataset.k ? 'text' : t.dataset.img ? 'img' : 'sec', selKey);
    }, true);
    document.addEventListener('dblclick', e => {
      const el = e.target.closest('[data-k]'); if (!el || (el.namespaceURI || '').includes('svg')) return;
      el.contentEditable = 'true'; el.focus();
      el.onblur = () => { el.contentEditable = 'false'; sp(cfg, el.dataset.k, el.innerText.replace(/\n+$/, '')); if (window.parent.onSel) window.parent.onSel('text', el.dataset.k); };
    }, true);
  }

  renderCart();
  route();   // hiện ngay giao diện mặc định, rồi nạp dữ liệu thật
  load();
</script>
</body>
</html>
