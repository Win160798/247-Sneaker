<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEDIA KIT - 247 Sneaker & Collab Studio</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #f2f2f2; color: #000; padding: 20px; display: flex; justify-content: center; }
    
    .page-wrapper {
      width: 100%;
      max-width: 1300px;
      background: #ffffff;
      border: 3px solid #000000;
      box-shadow: 8px 8px 0px #000000;
      padding: 30px;
    }

    /* Top Navigation / Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ccff00;
      border: 3px solid #000000;
      padding: 15px 25px;
      margin-bottom: 25px;
      box-shadow: 4px 4px 0px #000000;
    }
    .header-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .search-bar-wrap {
      display: flex;
      align-items: center;
      background: #fff;
      border: 2px solid #000;
      border-radius: 30px;
      padding: 8px 18px;
      width: 350px;
    }
    .search-bar-wrap input {
      border: none;
      outline: none;
      width: 100%;
      font-size: 14px;
      background: transparent;
    }
    .search-bar-wrap i { font-size: 14px; cursor: pointer; }

    /* Top 3 Featured Images Layout */
    .top-media-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .media-preview-box {
      border: 3px solid #000000;
      border-radius: 12px;
      height: 220px;
      overflow: hidden;
      background: #eaeaea;
      box-shadow: 4px 4px 0px #000000;
    }
    .media-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Big "MEDIA KIT" Header Banner */
    .media-kit-title-banner {
      background: #ccff00;
      border: 4px solid #000000;
      text-align: center;
      padding: 35px 0;
      margin-bottom: 35px;
      box-shadow: 6px 6px 0px #000000;
    }
    .media-kit-title-banner h1 {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #000;
      line-height: 1;
    }

    /* Main Product 3-Column Layout */
    .products-3col-layout {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }
    .column-container {
      border: 3px solid #000000;
      border-radius: 16px;
      background: #fafafa;
      padding: 15px;
      box-shadow: 5px 5px 0px #000000;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-height: 450px;
    }

    /* Product Item Card */
    .product-card-item {
      background: #ffffff;
      border: 2px solid #000000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 3px 3px 0px #000000;
      transition: transform 0.1s ease;
    }
    .product-card-item:hover {
      transform: translateY(-2px);
    }
    .product-thumb {
      width: 100%;
      height: 180px;
      background: #f0f0f0;
      border-bottom: 2px solid #000;
    }
    .product-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .product-details {
      padding: 12px;
    }
    .p-title {
      font-size: 14px;
      font-weight: 800;
      color: #000;
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .p-price {
      font-size: 15px;
      font-weight: 900;
      color: #e60012;
      margin-bottom: 8px;
    }
    .p-sizes {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 10px;
    }
    .size-badge {
      background: #eee;
      border: 1px solid #000;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-detail {
      background: #000000;
      color: #ccff00;
      border: 2px solid #000;
      width: 100%;
      padding: 8px;
      font-weight: 900;
      font-size: 12px;
      border-radius: 6px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-detail:hover {
      background: #222;
    }

    .empty-msg {
      text-align: center;
      padding: 30px;
      font-weight: bold;
      color: #666;
    }

    @media(max-width: 900px) {
      .top-media-grid, .products-3col-layout { grid-template-columns: 1fr; }
      .media-kit-title-banner h1 { font-size: 40px; }
      .top-header { flex-direction: column; gap: 15px; }
      .search-bar-wrap { width: 100%; }
    }
  </style>
</head>
<body>

<div class="page-wrapper">
  <!-- Top Navigation Header -->
  <div class="top-header">
    <div class="header-title"><i class="fa-solid fa-cube"></i> COLLAB STUDIO // 247 SNEAKER</div>
    <div class="search-bar-wrap">
      <input type="text" id="search-box" placeholder="Tìm kiếm sản phẩm, thương hiệu...">
      <i class="fa-solid fa-magnifying-glass"></i>
    </div>
  </div>

  <!-- Top 3 Gallery Images Preview -->
  <div class="top-media-grid">
    <div class="media-preview-box">
      <img src="https://images.unsplash.com/photo-1552346154-21d32810aba3?auto=format&fit=crop&w=700&q=80" alt="Preview 1">
    </div>
    <div class="media-preview-box">
      <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&w=700&q=80" alt="Preview 2">
    </div>
    <div class="media-preview-box">
      <img src="https://images.unsplash.com/photo-1515955656352-a1fa3ffcd111?auto=format&fit=crop&w=700&q=80" alt="Preview 3">
    </div>
  </div>

  <!-- MEDIA KIT Banner -->
  <div class="media-kit-title-banner">
    <h1>MEDIA KIT</h1>
  </div>

  <!-- 3 Column Product Display Grid -->
  <div class="products-3col-layout">
    <div class="column-container" id="column-1">
      <div class="empty-msg">Đang tải sản phẩm...</div>
    </div>
    <div class="column-container" id="column-2">
      <div class="empty-msg">Đang tải sản phẩm...</div>
    </div>
    <div class="column-container" id="column-3">
      <div class="empty-msg">Đang tải sản phẩm...</div>
    </div>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://uleckabliwereivgxryo.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVsZWNrYWJsaXdlcmVpdmd4cnlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzI1NTUsImV4cCI6MjEwNjMwODU1NX0.Sa5fY_OceWa7TI9yqBSMLM24ZTEN6g10j4RrXvENs3o';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function fetchAndRenderProducts(searchTerm = '') {
    try {
      let query = supabaseClient.from('products').select('*').order('id', { ascending: false });
      
      const { data: products, error } = await query;
      if (error) throw error;

      const col1 = document.getElementById('column-1');
      const col2 = document.getElementById('column-2');
      const col3 = document.getElementById('column-3');

      col1.innerHTML = '';
      col2.innerHTML = '';
      col3.innerHTML = '';

      let filtered = products || [];
      if (searchTerm.trim() !== '') {
        const term = searchTerm.toLowerCase();
        filtered = filtered.filter(p => p.name.toLowerCase().includes(term) || (p.description && p.description.toLowerCase().includes(term)));
      }

      if (filtered.length === 0) {
        col1.innerHTML = '<div class="empty-msg">Không tìm thấy sản phẩm nào.</div>';
        col2.innerHTML = '';
        col3.innerHTML = '';
        return;
      }

      filtered.forEach((item, index) => {
        const imageUrl = item.main_image || (item.images && item.images[0]) || 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=500&q=80';
        const formattedPrice = Number(item.price).toLocaleString('vi-VN') + ' đ';
        const sizesHtml = (item.sizes || []).map(s => `<span class="size-badge">${s}</span>`).join('');

        const cardHtml = `
          <div class="product-card-item">
            <div class="product-thumb">
              <img src="${imageUrl}" alt="${item.name}">
            </div>
            <div class="product-details">
              <div class="p-title" title="${item.name}">${item.name}</div>
              <div class="p-price">${formattedPrice}</div>
              <div class="p-sizes">${sizesHtml}</div>
              <button class="btn-detail" onclick="alert('Sản phẩm: ${item.name}\nMô tả: ${item.description || "Không có mô tả"}')">Xem Chi Tiết</button>
            </div>
          </div>
        `;

        // Chia đều vào 3 cột theo đúng thiết kế
        if (index % 3 === 0) {
          col1.innerHTML += cardHtml;
        } else if (index % 3 === 1) {
          col2.innerHTML += cardHtml;
        } else {
          col3.innerHTML += cardHtml;
        }
      });

      if (col1.innerHTML === '') col1.innerHTML = '<div class="empty-msg">Trống</div>';
      if (col2.innerHTML === '') col2.innerHTML = '<div class="empty-msg">Trống</div>';
      if (col3.innerHTML === '') col3.innerHTML = '<div class="empty-msg">Trống</div>';

    } catch (err) {
      console.error('Lỗi tải sản phẩm:', err);
    }
  }

  // Lắng nghe sự kiện tìm kiếm
  document.getElementById('search-box').addEventListener('input', (e) => {
    fetchAndRenderProducts(e.target.value);
  });

  fetchAndRenderProducts();
</script>

</body>
</html>
